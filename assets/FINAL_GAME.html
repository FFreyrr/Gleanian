<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wilderness Judgment - Single HTML</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@400;700&display=swap');
:root{
  --bg:#F7F5F0; --ink:#43403A; --dark:#2C2A26; --line:#DCD7C9;
  --muted:#8B8476; --pale:#A69F92; --green:#5F8D4E; --green-dark:#4D733F; --rust:#C16E5B;
  --bird-bg:#E9F0E8; --bug-bg:#F2ECE8; --slot:#E9E5D9;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh;user-select:none}.app{min-height:100vh;padding:8px;display:flex;flex-direction:column;align-items:center}.shell{width:min(1480px,100%)}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:22px 26px;margin-bottom:18px;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border-radius:24px;box-shadow:0 3px 14px rgba(44,42,38,.05)}
h1{font-family:'Playfair Display',serif;font-size:34px;line-height:1;margin:0;color:var(--dark)}.subtitle,.overline{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);font-weight:800;margin-top:8px}.head-right{display:flex;gap:24px;align-items:center}.target{text-align:right}.target small{display:block;font-size:10px;text-transform:uppercase;color:var(--pale);font-weight:800}.target strong{font-family:ui-monospace,monospace;font-size:22px;color:var(--green)}button{font:inherit;border:0;cursor:pointer}.reset{display:flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;background:white;border:1px solid var(--line);color:var(--ink);font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:.2s}.reset:hover{border-color:var(--green);color:var(--green);transform:translateY(-1px)}
.phase{display:flex;align-items:center;gap:14px;border-left:5px solid var(--rust);padding-left:16px;margin-bottom:26px}.phase h2{margin:0;color:var(--dark);font-size:18px;text-transform:uppercase}.phase p{margin:0;font-size:14px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-bottom:18px}.slot-wrap{display:flex;flex-direction:column;gap:10px}.slot{position:relative;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:28px;background:rgba(255,255,255,.34);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;transition:.2s}.slot.dragover,.slot:hover{border-color:var(--green);background:rgba(255,255,255,.55)}.slot.filled{border-color:var(--green);box-shadow:0 16px 28px rgba(95,141,78,.10)}.empty-icon{width:56px;height:56px;border-radius:50%;background:var(--slot);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}.slot-label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;color:var(--pale)}.slot-sub{font-size:10px;color:var(--pale);margin-top:7px}
.card{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 9px 20px rgba(44,42,38,.09);padding:16px;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}.slot .card{width:100%;height:100%;position:relative}.deck .card{width:168px;height:236px;flex:0 0 auto;cursor:grab}.deck .card:hover{transform:translateY(-10px);border-color:var(--green);box-shadow:0 16px 28px rgba(95,141,78,.20)}.card.disabled{opacity:.35;filter:grayscale(1);pointer-events:none}.remove{position:absolute;right:-9px;top:-9px;background:var(--rust);color:white;border-radius:999px;width:28px;height:28px;box-shadow:0 4px 10px rgba(0,0,0,.22);font-size:18px;line-height:28px}.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}.card-id{font-family:'Playfair Display',serif;font-size:25px;font-weight:700;color:var(--dark)}.type-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}.bird .type-icon{background:var(--bird-bg);color:var(--green)}.insect .type-icon{background:var(--bug-bg);color:var(--rust)}.card-name{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;color:var(--ink);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skill-row{display:flex;justify-content:space-between;font-size:10px;font-weight:900;margin:7px 0}.skill-row span:first-child{font-family:ui-monospace,monospace;color:var(--pale);text-transform:uppercase}.type-tag{margin-top:auto;padding-top:10px;border-top:1px solid #F0EBE0;font-size:10px;text-transform:uppercase;font-weight:900;letter-spacing:-.02em}.bird .type-tag{color:var(--green)}.insect .type-tag{color:var(--rust)}.stats{margin-top:auto;background:var(--bg);border:1px solid rgba(220,215,201,.7);border-radius:16px;padding:12px}.statline{display:flex;justify-content:space-between;align-items:center;font-size:10px;text-transform:uppercase;font-weight:900;color:var(--muted);margin:6px 0}.statline b{color:var(--dark)}.statline .bonus{color:var(--green)}.result-box{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.final{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:1000;margin-top:8px}.success{color:var(--green)}.fail{color:var(--rust)}.badge{background:white;border:1px solid rgba(0,0,0,.05);border-radius:8px;padding:4px 8px;box-shadow:0 2px 6px rgba(0,0,0,.04)}.spinner{font-size:30px;text-align:center;animation:spin .8s linear infinite;padding:10px}@keyframes spin{to{transform:rotate(360deg)}}
.board{display:grid;grid-template-columns:3fr 1fr;gap:18px;margin-bottom:18px}.deck-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}.deck-head h3{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.counts{display:flex;gap:18px;font-size:10px;text-transform:uppercase;font-weight:900}.counts .birds{color:var(--green)}.counts .bugs{color:var(--rust)}.deck{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 24px}.empty-deck{width:100%;padding:45px;border:2px dashed var(--line);border-radius:22px;text-align:center;color:var(--pale);font-family:'Playfair Display',serif;font-style:italic;background:rgba(255,255,255,.25)}
.panel{background:white;border:1px solid var(--line);border-radius:30px;box-shadow:0 18px 40px rgba(44,42,38,.11);padding:24px;min-height:300px;position:relative;overflow:hidden}.panel:before{content:"";position:absolute;left:0;top:0;width:100%;height:5px;background:var(--green)}.panel-content{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center}.bigmark{width:62px;height:62px;border-radius:18px;background:var(--dark);color:white;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;margin-bottom:18px}.requirements{width:100%;margin:4px 0 32px;text-align:left}.req{display:flex;gap:12px;align-items:center;margin:16px 0;font-size:10px;text-transform:uppercase;font-weight:900;color:var(--pale)}.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}.dot.ok-bird{background:var(--green)}.dot.ok-bug{background:var(--rust)}.commit{margin-top:auto;width:100%;padding:16px;border-radius:999px;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:900;background:var(--green);color:white;box-shadow:0 10px 20px rgba(95,141,78,.22);transition:.2s}.commit:disabled{background:var(--line);color:var(--pale);box-shadow:none;cursor:not-allowed}.commit:not(:disabled):hover{background:var(--green-dark)}.panel .rolling{font-size:48px;margin:36px 0 18px;animation:spin .65s linear infinite}.panel-status{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);font-weight:900}.victory .bigmark{background:var(--green)}.defeat .bigmark{background:var(--rust)}.recheck{margin-top:auto;width:100%;padding:16px;border-radius:999px;background:var(--dark);color:white;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:900}.result-title{text-transform:uppercase;letter-spacing:.18em;font-size:14px;font-weight:900}.result-sub{font-size:10px;font-family:ui-monospace,monospace;color:var(--pale);margin:10px 0 28px}footer{display:flex;justify-content:space-between;gap:24px;border-top:1px solid var(--line);padding:26px 0;color:var(--muted)}footer .cols{display:flex;gap:45px}.foot-title{font-size:10px;font-weight:900;color:var(--pale);text-transform:uppercase;margin-bottom:7px}.foot-text{max-width:230px;font-size:10px;line-height:1.6}.design-id{font-size:10px;font-family:ui-monospace,monospace;font-weight:900;color:var(--pale);text-align:right}
.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:var(--dark);color:white;border-radius:999px;padding:12px 18px;font-size:12px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;top:34px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media(max-width:900px){.slots{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:1fr}.head-right .target{display:none}}@media(max-width:560px){.app{padding:14px}header{align-items:flex-start;gap:18px;flex-direction:column}h1{font-size:28px}.slots{grid-template-columns:1fr}.phase{align-items:flex-start;flex-direction:column;gap:4px}.deck .card{width:150px;height:220px}footer,footer .cols{flex-direction:column}.design-id{text-align:left}}
</style>
</head>
<body>
<div class="app"><div class="shell" id="app"></div></div><div class="toast" id="toast"></div>
<script>
const CARDS=[
{id:'A',name:'Harry-Hummingbird',type:'BIRD',skillValue:7,skillName:'distract',description:'High frequency hovering to divert enemy attention.'},
{id:'B',name:'Paul-Blackbird',type:'BIRD',skillValue:8,skillName:'strategy',description:'Calculated flight paths and tactical insight.'},
{id:'C',name:'Elequa-Parrot',type:'BIRD',skillValue:6,skillName:'leadership',description:'Inspiring calls that rally all nearby units.'},
{id:'D',name:'Elowen-Lacewing',type:'INSECT',skillValue:9,skillName:'sneak',description:'Ultra-thin wings for silent, invisible movement.'},
{id:'E',name:'Terra-Ant',type:'INSECT',skillValue:8,skillName:'strength',description:'Carries ten times its weight with ease.'},
{id:'F',name:'Nora-Bumblebee',type:'INSECT',skillValue:7,skillName:'speed',description:'High-velocity buzzing for rapid breakthroughs.'}
];
const SLOTS=[
{id:1,requiredType:'BIRD',label:'Primary Fighter',flavorCheck:'Combat'},
{id:2,requiredType:'BIRD',label:'Tactical Support',flavorCheck:'Disruption'},
{id:3,requiredType:'INSECT',label:'Stealth Unit',flavorCheck:'Stealth'},
{id:4,requiredType:'INSECT',label:'Rapid Response',flavorCheck:'Speed'}
];
let deck=[...CARDS], placed=[null,null,null,null], rollResults={}, gameState='IDLE', dragged=null, toastTimer=null;
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function icon(type){return type==='BIRD'?'🐦':'🐞'}
function partnerIndex(slotId){return slotId===1?1:slotId===2?0:slotId===3?3:2}
function supportFor(slotId){const p=placed[partnerIndex(slotId)];return p?Math.floor(p.skillValue/2):0}
function canStart(){return placed.filter(Boolean).length>=2 && placed.some(c=>c&&c.type==='BIRD') && placed.some(c=>c&&c.type==='INSECT')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
function cardHTML(card,inSlot=false,slotId=null){const rr=slotId?rollResults[slotId]:null;return `<div class="card ${card.type==='BIRD'?'bird':'insect'} ${gameState!=='IDLE'&&!inSlot?'disabled':''}" ${!inSlot&&gameState==='IDLE'?`draggable="true" data-card="${card.id}"`:''}>
${inSlot&&gameState==='IDLE'?`<button class="remove" data-remove="${slotId-1}" title="Remove">×</button>`:''}
<div class="card-top"><div class="card-id">${card.id}</div><div class="type-icon">${icon(card.type)}</div></div>
<div class="card-name">${esc(card.name)}</div>
${inSlot?`<div class="skill-row"><span>${esc(card.skillName)} check</span></div>
<div class="stats"><div class="statline"><span>Base</span><b>${card.skillValue}</b></div><div class="statline"><span>Support</span><span class="bonus">+${supportFor(slotId)}</span></div>
${rr? rr.isRolling?`<div class="spinner">🎲</div>`:`<div class="result-box"><div class="statline"><span>Luck</span><span class="bonus">+${rr.diceValue}</span></div><div class="final ${rr.isSuccess?'success':'fail'}"><span>RESULT</span><span class="badge">${rr.totalValue}</span></div></div>`:''}</div>`:
`<div><div class="skill-row"><span>${esc(card.skillName)}</span><b>${card.skillValue}</b></div></div><div class="type-tag">Type: ${card.type}</div>`}
</div>`}
function render(){const totalSuccess=Object.values(rollResults).filter(r=>r.isSuccess).length;const placedCount=placed.filter(Boolean).length;const victory=totalSuccess===placedCount&&totalSuccess>0;app.innerHTML=`
<header><div><h1>Wilderness Judgment</h1><div class="subtitle">Card-Based Logic Encounter</div></div><div class="head-right"><div class="target"><small>Target Score</small><strong>&gt; 10.0</strong></div><button class="reset" id="resetBtn">↻ Reset</button></div></header>
<main><div class="phase"><h2>Phase 1: The Formation</h2><p>Place your units into the designated trial slots.</p></div>
<section class="slots">${SLOTS.map((s,i)=>`<div class="slot-wrap"><div class="slot ${placed[i]?'filled':''}" data-slot="${i}">${placed[i]?cardHTML(placed[i],true,s.id):`<div><div class="empty-icon">${icon(s.requiredType)}</div><div class="slot-label">Slot 0${s.id}: ${s.requiredType}</div><div class="slot-sub">${s.id<=2?'Woodpecker Guards':'Termite Nest'}</div></div>`}</div></div>`).join('')}</section>
<section class="board"><div><div class="deck-head"><h3>Available Arsenal</h3><div class="counts"><span class="birds">Birds: ${deck.filter(c=>c.type==='BIRD').length}</span><span class="bugs">Insects: ${deck.filter(c=>c.type==='INSECT').length}</span></div></div><div class="deck">${deck.length?deck.map(c=>cardHTML(c)).join(''):`<div class="empty-deck">All units deployed to the field</div>`}</div></div>
<aside class="panel"><div class="panel-content ${gameState==='RESULT'?(victory?'victory':'defeat'):''}">${panelHTML(totalSuccess,placedCount,victory)}</div></aside></section></main>
<footer><div class="cols"><div><div class="foot-title">Mechanics</div><div class="foot-text">Stat + Partner Support (50%) + d6 Luck. Required clearance &gt; 10.0.</div></div><div><div class="foot-title">Constraints</div><div class="foot-text">Dual biodiversity mandatory for sequence initiation.</div></div></div><div class="design-id">DESIGN_ID: NATURE_GAMBIT // ARCH_2026</div></footer>`;bindEvents()}
function panelHTML(total,placedCount,victory){if(gameState==='ROLLING')return `<div class="rolling">🎲</div><div class="panel-status">Calculating Path...</div>`;if(gameState==='RESULT')return `<div class="bigmark">${victory?'✓':'×'}</div><div class="result-title ${victory?'success':'fail'}">${victory?'VICTORY':'DEFEAT'}</div><div class="result-sub">${total} / ${placedCount} PATHS CLEARED</div><button class="recheck" id="recheckBtn">Re-Evaluate</button>`;return `<div class="bigmark">?</div><div class="panel-status">Protocol Initiation</div><div class="requirements"><div class="req"><span class="dot ${placed.some(c=>c&&c.type==='BIRD')?'ok-bird':''}"></span>Avian Unit</div><div class="req"><span class="dot ${placed.some(c=>c&&c.type==='INSECT')?'ok-bug':''}"></span>Insectoid Unit</div></div><button class="commit" id="commitBtn" ${canStart()?'':'disabled'}>Commit Deck</button>`}
function bindEvents(){document.getElementById('resetBtn').onclick=resetGame;document.getElementById('recheckBtn')&&(document.getElementById('recheckBtn').onclick=resetGame);document.getElementById('commitBtn')&&(document.getElementById('commitBtn').onclick=startCheck);document.querySelectorAll('[data-card]').forEach(el=>{el.addEventListener('dragstart',e=>{dragged=deck.find(c=>c.id===el.dataset.card);e.dataTransfer.setData('text/plain',el.dataset.card)});});document.querySelectorAll('[data-slot]').forEach(el=>{el.addEventListener('dragover',e=>{if(gameState==='IDLE'){e.preventDefault();el.classList.add('dragover')}});el.addEventListener('dragleave',()=>el.classList.remove('dragover'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dragover');const id=e.dataTransfer.getData('text/plain')||(dragged&&dragged.id);dropCard(Number(el.dataset.slot),id)});});document.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>removeCard(Number(btn.dataset.remove)))}
function dropCard(slotIndex,cardId){if(gameState!=='IDLE')return;const card=deck.find(c=>c.id===cardId)||dragged;if(!card)return;if(SLOTS[slotIndex].requiredType!==card.type){showToast(`This slot requires ${SLOTS[slotIndex].requiredType}.`);const slot=document.querySelector(`[data-slot="${slotIndex}"]`);slot&&slot.classList.add('shake');setTimeout(()=>slot&&slot.classList.remove('shake'),280);return;}const old=placed[slotIndex];placed[slotIndex]=card;deck=deck.filter(c=>c.id!==card.id);if(old)deck.push(old);rollResults={};dragged=null;render()}
function removeCard(slotIndex){if(gameState!=='IDLE')return;const card=placed[slotIndex];if(!card)return;placed[slotIndex]=null;deck.push(card);rollResults={};render()}
function resetGame(){deck=[...CARDS];placed=[null,null,null,null];rollResults={};gameState='IDLE';dragged=null;render()}
async function startCheck(){if(!canStart())return;gameState='ROLLING';rollResults={};render();for(const slot of SLOTS){const card=placed[slot.id-1];if(!card)continue;rollResults[slot.id]={slotId:slot.id,diceValue:0,supportBonus:supportFor(slot.id),totalValue:0,isSuccess:false,isRolling:true};render();await new Promise(r=>setTimeout(r,650));const dice=Math.floor(Math.random()*6)+1;const total=card.skillValue+supportFor(slot.id)+dice;rollResults[slot.id]={slotId:slot.id,diceValue:dice,supportBonus:supportFor(slot.id),totalValue:total,isSuccess:total>=10,isRolling:false};render();await new Promise(r=>setTimeout(r,250));}gameState='RESULT';render();
const placedCount=placed.filter(Boolean).length;
const totalSuccess=Object.values(rollResults).filter(r=>r.isSuccess).length;
const victory=totalSuccess===placedCount&&totalSuccess>0;
try{ window.parent.postMessage({type:'FINAL_GAME_COMPLETE', success:victory}, '*'); }catch(e){}
}
render();
</script>
</body>
</html>
