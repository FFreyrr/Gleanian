<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nora's Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080400;min-height:100vh;font-family:'DM Sans', sans-serif;overflow:hidden}
#game{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#100700}
#c{width:100vw;height:100vh;display:block}
#ui{position:absolute;right:18px;top:18px;background:rgba(8,3,0,.88);border:1px solid rgba(255,208,64,.42);color:#edb840;padding:14px 16px;border-radius:14px;line-height:1.5;min-width:240px;box-shadow:0 12px 30px rgba(0,0,0,.34);backdrop-filter:blur(3px)}
#ui h2{color:#ffd040;font-size:22px;margin-bottom:10px;letter-spacing:.4px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:15px;gap:14px;margin-top:8px}
.v{color:#ffe880;font-weight:700}
.steps-value{font-size:34px;line-height:1;color:#fff0a2;text-shadow:0 0 14px rgba(255,208,64,.55)}
.meter{height:12px;margin-top:7px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,208,64,.25);overflow:hidden}
.meter-fill{width:0%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffb52e,#ffe87c);box-shadow:0 0 14px rgba(255,208,64,.7);transition:width .22s ease}
.red{color:#ed8166}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20}
#ov.on{display:flex}
#bx{background:#0c0500;border:2px solid #ffd040;color:#edb840;padding:42px 60px;border-radius:20px;text-align:center;max-width:560px}
#bx h2{color:#ffd040;font-size:32px;margin-bottom:16px}
#bx p{font-size:18px;line-height:1.8}
.q{color:#ed8166;font-style:normal;margin-top:14px;font-size:15px;line-height:1.8}
button{margin-top:26px;background:#ffd040;color:#080400;border:none;padding:13px 38px;border-radius:12px;cursor:pointer;font-size:17px;font-weight:700}
button:hover{background:#ffe860}


/* === Shared UI style layer: soft woodland storybook UI === */
:root{
  --ui-cream:#fff8e8;
  --ui-ink:#2f341f;
  --ui-muted:#6f6d50;
  --ui-olive:#5e6b3d;
  --ui-gold:#d9a84f;
  --ui-red:#b8695f;
  --ui-panel:rgba(255,248,232,.90);
  --ui-panel-strong:rgba(255,248,232,.97);
  --ui-border:rgba(91,97,54,.22);
  --ui-shadow:0 22px 60px rgba(36,31,18,.28);
  --ui-soft-shadow:0 12px 30px rgba(36,31,18,.16);
}
body{font-family:'DM Sans', sans-serif;background:#e9dfcc;color:var(--ui-ink)}
#game{background:#e9dfcc}
#ui{
  background:var(--ui-panel);
  color:var(--ui-ink);
  border:1px solid var(--ui-border);
  border-radius:28px;
  box-shadow:var(--ui-shadow);
  backdrop-filter:blur(10px) saturate(1.05);
  padding:16px 18px;
}
#ui h2{color:var(--ui-ink);font-style:normal;letter-spacing:-.02em}
.row{color:var(--ui-muted)}
.v,.steps-value{color:var(--ui-gold);text-shadow:none}
.meter{background:rgba(91,97,54,.12);border:1px solid var(--ui-border)}
.meter-fill{background:linear-gradient(90deg,#b78b3e,#d9a84f);box-shadow:0 0 14px rgba(217,168,79,.42)}
.red,.q{color:var(--ui-red)}
#ov{background:rgba(31,38,20,.58);backdrop-filter:blur(5px)}
#bx{
  background:var(--ui-panel-strong);
  color:var(--ui-ink);
  border:1px solid var(--ui-border);
  border-radius:34px;
  box-shadow:var(--ui-shadow);
}
#bx h2{color:var(--ui-ink);font-style:normal;letter-spacing:-.025em}
#bx p{color:var(--ui-muted)}
button{
  background:linear-gradient(180deg,#6f7947,#4d5a32);
  color:#fff8e8;
  border:1px solid rgba(255,248,232,.36);
  border-radius:999px;
  box-shadow:0 14px 28px rgba(62,73,39,.24);
}
button:hover{background:linear-gradient(180deg,#76834d,#536139);filter:brightness(1.03)}
@media (max-width:700px){#ui{right:12px;top:12px;min-width:210px;border-radius:24px}#bx{margin:0 18px;padding:34px 28px}}

/* === responsive board/layout fix === */
#ui{z-index:5}
@media (max-width:1280px){
  #ui{right:12px;top:12px;min-width:220px;padding:14px 16px}
}
@media (max-width:980px){
  #ui{
    left:50%;right:auto;top:12px;transform:translateX(-50%);
    width:min(94vw,720px);min-width:0;
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;
    padding:14px 16px 16px;border-radius:24px;
  }
  #ui h2{width:100%;margin-bottom:2px;text-align:center;font-size:20px}
  #ui .row{flex:1 1 160px;margin-top:0}
  #ui .meter{width:100%;margin-top:0;order:10}
}
@media (max-width:640px){
  #ui{width:min(96vw,560px);padding:12px 14px 14px;gap:6px 12px}
  #ui h2{font-size:18px}
  .row{font-size:14px}
  .steps-value{font-size:28px}
}

</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="ui">
  <h2>Nora's Game</h2>
  <div class="row"><span>Pollen</span><span class="v" id="u_p">0/10</span></div>
  <div class="meter"><div class="meter-fill" id="u_pbar"></div></div>
  <div class="row"><span>Steps</span><span class="v steps-value" id="u_s2">0</span></div>
  <div class="row"><span>Speed Level</span><span class="v" id="u_s">0</span></div>
</div>
</div>
<div id="ov" class="on">
  <div id="bx">
    <h2 id="b_t">A bumblebee’s day</h2>
    <div id="b_b">
      <p>Your busy day as a worker begins!</p>
      <p>Move around, avoid seeds and rocks, and collect 10 flower pollen.</p>
    </div>
    <button id="ov_btn" onclick="startGame()">Start</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const uiPanel=document.getElementById('ui');
function resizeCanvas(){
  cv.width=window.innerWidth;
  cv.height=window.innerHeight;
}
function updateLayout(){
  resizeCanvas();
  W=cv.width;H=cv.height;
  const margin=Math.max(12,Math.min(22,Math.round(Math.min(W,H)*0.02)));
  const uiRect=uiPanel.getBoundingClientRect();
  let leftPad=margin,rightPad=margin,topPad=margin,bottomPad=margin;
  const isTopBar=W<=980;
  if(isTopBar){
    topPad=Math.max(topPad,Math.ceil(uiRect.bottom)+margin);
  }else{
    rightPad=Math.max(rightPad,Math.ceil(W-uiRect.left)+margin);
  }
  const playW=Math.max(220,W-leftPad-rightPad);
  const playH=Math.max(220,H-topPad-bottomPad);
  const boardWFactor=2*Math.sqrt(3)*(GR+0.5);
  const boardHFactor=3*GR+2;
  SZ=Math.max(20,Math.min(48,Math.floor(Math.min(playW/boardWFactor,playH/boardHFactor))));
  CX=leftPad+playW/2;
  CY=topPad+playH/2;
  if(bee)beeDraw=hp(bee.q,bee.r);
}
resizeCanvas();
let W=cv.width,H=cv.height,CX=W/2,CY=H/2,SZ=36,GR=5;
window.addEventListener('resize',()=>{
  updateLayout();
  render();
});
const K=(q,r)=>`${q},${r}`;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const R3=Math.sqrt(3);

// pointy-top hex → pixel
function hp(q,r){return{x:CX+SZ*(R3*q+R3/2*r),y:CY+SZ*1.5*r}}

function poly(q,r,s=1){
  const{x,y}=hp(q,r);ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i-Math.PI/6;
    i?ctx.lineTo(x+SZ*s*Math.cos(a),y+SZ*s*Math.sin(a))
     :ctx.moveTo(x+SZ*s*Math.cos(a),y+SZ*s*Math.sin(a));
  }
  ctx.closePath();
}

function drawHoneycombBackground(){
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#3b1b02');
  bg.addColorStop(.45,'#160900');
  bg.addColorStop(1,'#050200');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);
  const cell=54;
  const hexH=cell*Math.sqrt(3);
  ctx.lineWidth=2;
  for(let y=-hexH;y<H+hexH;y+=hexH){
    for(let x=-cell;x<W+cell;x+=cell*1.5){
      const ox=((Math.round(y/hexH)%2) ? cell*.75 : 0);
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=Math.PI/3*i;
        const px=x+ox+cell*Math.cos(a);
        const py=y+cell*Math.sin(a);
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.closePath();
      ctx.fillStyle='rgba(255,177,35,.045)';
      ctx.fill();
      ctx.strokeStyle='rgba(255,197,58,.18)';
      ctx.stroke();
    }
  }
}

function bfs(sq,sr,eq,er){
  const vis=new Set(),qu=[[sq,sr,0]];vis.add(K(sq,sr));
  while(qu.length){
    const[cq,cr,d]=qu.shift();
    if(cq===eq&&cr===er)return d;
    for(const[dq,dr]of DIRS){
      const nq=cq+dq,nr=cr+dr,nk=K(nq,nr);
      if(!vis.has(nk)&&cells.has(nk)&&cells.get(nk)==='E'){vis.add(nk);qu.push([nq,nr,d+1])}
    }
  }
  return 999;
}

let cells,bee,beeDraw,pollenPos,pollen,steps,anim=null;
let gameStarted=false, gameFinished=false;
let showTapHint = false;
updateLayout();

function spawnPollen(){
  let pq,pr,d,t=0;
  do{
    const emp=[...cells.keys()].filter(k=>cells.get(k)==='E'&&k!==K(bee.q,bee.r));
    const far=emp.filter(k=>{
      const[q,r]=k.split(',').map(Number);
      return Math.abs(q-bee.q)+Math.abs(r-bee.r)+Math.abs(q+r-bee.q-bee.r)>=6;
    });
    const pool=far.length?far:emp;
    [pq,pr]=pool[Math.floor(Math.random()*pool.length)].split(',').map(Number);
    d=bfs(bee.q,bee.r,pq,pr);
  }while(d===999&&++t<30);
  pollenPos={q:pq,r:pr};
}

function generateObstacles(){
  // clear old obstacles first
  for(const k of cells.keys())cells.set(k,'E');

  // keep the bee and immediate movement options open so the game never traps Norah
  const safe=new Set([K(bee.q,bee.r),...DIRS.map(([dq,dr])=>K(bee.q+dq,bee.r+dr))]);
  const candidates=[...cells.keys()].filter(k=>!safe.has(k));
  const targetCount=Math.floor(candidates.length*.25);

  // retry a few times until the bee still has a good reachable area
  for(let attempt=0;attempt<40;attempt++){
    for(const k of cells.keys())cells.set(k,'E');
    const shuffled=[...candidates].sort(()=>Math.random()-.5);
    shuffled.slice(0,targetCount).forEach(k=>{
      cells.set(k,Math.random()<.5?'R':'B'); // R = rock, B = branch
    });

    let reachable=0;
    for(const k of cells.keys()){
      if(cells.get(k)==='E'){
        const[q,r]=k.split(',').map(Number);
        if(bfs(bee.q,bee.r,q,r)<999)reachable++;
      }
    }
    if(reachable>28)return;
  }
}

function init(){
  cells=new Map();
  for(let q=-GR;q<=GR;q++)
    for(let r=-GR;r<=GR;r++)
      if(Math.abs(q+r)<=GR)cells.set(K(q,r),'E');

  bee={q:0,r:0};beeDraw=hp(0,0);pollen=0;steps=0;anim=null;
  // Show a first-move guide after entering the game. It disappears after the first valid tap.
  showTapHint = true;
  generateObstacles();
  spawnPollen();render();uiUpdate();
}

function startGame(){
  gameStarted=true;
  gameFinished=false;
  const btn=document.getElementById('ov_btn');
  btn.textContent='Start';
  btn.onclick=startGame;
  document.getElementById('ov').classList.remove('on');
  init();
}

function continueNext(){
  gameStarted=false;
  gameFinished=true;
  // Only send the continue signal. Do not call init() and do not send the old COMPLETE event,
  // because some parent pages may treat COMPLETE as a command to reload/restart this minigame.
  try { window.parent.postMessage({type:'NORAMINIGAME_CONTINUE'}, '*'); } catch(e) {}
  try { window.dispatchEvent(new CustomEvent('NORAMINIGAME_CONTINUE')); } catch(e) {}
  const btn=document.getElementById('ov_btn');
  btn.disabled=true;
  btn.textContent='Continuing...';
}

const speed=()=>pollen;

function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

function finishMove(){
  steps++;
  if(pollenPos&&bee.q===pollenPos.q&&bee.r===pollenPos.r){
    pollen++;
    if(pollen>=10){anim=null;render();uiUpdate();endGame();return}
    generateObstacles(); // every new flower refreshes the rocks and branches
    spawnPollen();
  }
  anim=null;render();uiUpdate();
}

function animateMove(now){
  if(!anim)return;
  const t=Math.min((now-anim.t0)/anim.dur,1),e=easeInOut(t);
  beeDraw.x=anim.from.x+(anim.to.x-anim.from.x)*e;
  beeDraw.y=anim.from.y+(anim.to.y-anim.from.y)*e+Math.sin(e*Math.PI)*-10;
  render();
  if(t<1)requestAnimationFrame(animateMove);
  else{beeDraw={...anim.to};finishMove()}
}

function move(dq,dr){
  if(anim)return;
  const nq=bee.q+dq,nr=bee.r+dr,nk=K(nq,nr);
  if(!cells.has(nk)||cells.get(nk)!=='E')return;
  if(showTapHint){
    showTapHint=false;
    sessionStorage.setItem('noraTapHintSeen','1');
  }
  const from={...beeDraw},to=hp(nq,nr);
  bee.q=nq;bee.r=nr;
  anim={from,to,t0:performance.now(),dur:360};
  requestAnimationFrame(animateMove);
}

function uiUpdate(){
  document.getElementById('u_p').textContent=`${pollen}/10`;
  document.getElementById('u_pbar').style.width=`${Math.min(100,pollen*10)}%`;
  document.getElementById('u_s2').textContent=steps;
  const sp=speed();
  document.getElementById('u_s').textContent=`Lv ${sp}`;
}

function endGame(){
  document.getElementById('ov').classList.add('on');
  document.getElementById('b_t').textContent='🌟 Mission Complete!';
  document.getElementById('b_b').innerHTML=`
    <p>Pollen 10/10 &nbsp;·&nbsp; Total steps ${steps}</p>
    <p class="q">Great job! Nora's bee found every flower through the seeds and rocks.</p>
  `;
  const btn=document.getElementById('ov_btn');
  btn.textContent='Continue';
  btn.onclick=continueNext;
}

function getGuideTarget(){
  if(!showTapHint || !pollenPos || steps>0)return null;
  let best=null,bestScore=Infinity;
  for(const[dq,dr]of DIRS){
    const q=bee.q+dq,r=bee.r+dr,k=K(q,r);
    if(!cells.has(k)||cells.get(k)!=='E')continue;
    // Pick the clickable glowing neighbor that brings the bee closest to the flower.
    // BFS distance respects rocks/branches; pixel distance is only a fallback/tie-breaker.
    const pathDist=bfs(q,r,pollenPos.q,pollenPos.r);
    const pixelDist=Math.hypot(hp(q,r).x-hp(pollenPos.q,pollenPos.r).x,hp(q,r).y-hp(pollenPos.q,pollenPos.r).y);
    const score=(pathDist>=999?9990:pathDist*1000)+pixelDist;
    if(score<bestScore){bestScore=score;best={q,r};}
  }
  return best;
}

function guideLabelBox(x,y,w,h){
  const margin=18;
  const ui=document.getElementById('ui');
  const uiRect=ui.getBoundingClientRect();
  const canvasRect=cv.getBoundingClientRect();
  const uiBox={
    left:(uiRect.left-canvasRect.left)*(W/canvasRect.width)-10,
    right:(uiRect.right-canvasRect.left)*(W/canvasRect.width)+10,
    top:(uiRect.top-canvasRect.top)*(H/canvasRect.height)-10,
    bottom:(uiRect.bottom-canvasRect.top)*(H/canvasRect.height)+10
  };
  const candidates=[
    {x:x+w*.36,y:y-SZ*.98-h/2},
    {x:x+w*.36,y:y+SZ*.98+h/2},
    {x:x-w*.72,y:y},
    {x:x+w*.72,y:y},
    {x:W/2,y:Math.min(H-margin-h/2,y+SZ*1.45+h/2)}
  ];
  const overlaps=(b)=>!(b.right<uiBox.left||b.left>uiBox.right||b.bottom<uiBox.top||b.top>uiBox.bottom);
  for(const c of candidates){
    const cx=Math.max(margin+w/2,Math.min(W-margin-w/2,c.x));
    const cy=Math.max(margin+h/2,Math.min(H-margin-h/2,c.y));
    const box={left:cx-w/2,right:cx+w/2,top:cy-h/2,bottom:cy+h/2};
    if(!overlaps(box))return {x:cx,y:cy};
  }
  return {x:Math.max(margin+w/2,Math.min(W-margin-w/2,x)),y:Math.max(margin+h/2,Math.min(H-margin-h/2,y+SZ*1.35+h/2))};
}

function drawGuideOverlay(pulse){
  const target=getGuideTarget();
  if(!target)return;
  const{x,y}=hp(target.q,target.r);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i-Math.PI/6;
    const px=x+SZ*1.14*Math.cos(a),py=y+SZ*1.14*Math.sin(a);
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(0,0,0,.66)';
  ctx.fill('evenodd');
  ctx.restore();

  ctx.save();
  poly(target.q,target.r,1.03);
  ctx.fillStyle=`rgba(255,224,74,${0.32+pulse*0.18})`;
  ctx.fill();
  poly(target.q,target.r,1.08);
  ctx.strokeStyle=`rgba(255,246,160,${0.92+pulse*0.08})`;
  ctx.lineWidth=5;
  ctx.shadowColor='rgba(255,220,70,.95)';
  ctx.shadowBlur=24;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x,y,SZ*.18+pulse*SZ*.05,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,190,.9)';
  ctx.fill();
  ctx.restore();

  const text='Tap a glowing hex';
  ctx.save();
  ctx.font=`700 ${Math.max(18, Math.min(24, SZ*.52))}px 'DM Sans', sans-serif`;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  const padX=18,w=ctx.measureText(text).width+padX*2,h=38;
  const pos=guideLabelBox(x,y,w,h);
  ctx.shadowColor='rgba(0,0,0,.7)';
  ctx.shadowBlur=14;
  ctx.fillStyle='rgba(255,236,132,.96)';
  ctx.beginPath();
  ctx.roundRect(pos.x-w/2,pos.y-h/2,w,h,18);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(70,36,0,.9)';
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle='#2b1500';
  ctx.fillText(text,pos.x,pos.y+1);

  ctx.strokeStyle='rgba(255,236,132,.95)';
  ctx.lineWidth=3;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y + (pos.y<y ? h/2-2 : -h/2+2));
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.restore();
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawHoneycombBackground();

  for(const[k,t]of cells){
    const[q,r]=k.split(',').map(Number);
    if(t==='R'||t==='B'){
      // warm brown base under both rocks and branches
      const w=Math.sin(q*.55+r*.7+2.4)*.5+.5;
      poly(q,r);ctx.fillStyle=`hsl(${28+w*10},${45+w*12}%,${32+w*10}%)`;ctx.fill();
      ctx.strokeStyle='rgba(96,54,18,.82)';ctx.lineWidth=1.5;ctx.stroke();
      const{x,y}=hp(q,r);
      const grass=ctx.createRadialGradient(x-SZ*.22,y-SZ*.28,SZ*.04,x,y,SZ*.8);
      grass.addColorStop(0,'rgba(205,255,130,.18)');grass.addColorStop(1,'rgba(0,45,0,.12)');
      poly(q,r,.84);ctx.fillStyle=grass;ctx.fill();
      if(t==='R'){
        ctx.fillStyle='#2d1808';
        ctx.beginPath();ctx.ellipse(x,y,SZ*.44,SZ*.36,0.4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#3b230f';
        ctx.beginPath();ctx.ellipse(x-5,y-4,SZ*.22,SZ*.15,-.4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#140903';
        ctx.beginPath();ctx.ellipse(x+8,y+7,SZ*.18,SZ*.12,.2,0,Math.PI*2);ctx.fill();
      }else{
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate((q-r)*0.32);
        ctx.strokeStyle='#4b2a0c';ctx.lineWidth=8;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(-SZ*.42,SZ*.08);ctx.lineTo(SZ*.42,-SZ*.08);ctx.stroke();
        ctx.strokeStyle='#6b3b12';ctx.lineWidth=4;
        ctx.beginPath();ctx.moveTo(-SZ*.08,0);ctx.lineTo(-SZ*.28,-SZ*.25);ctx.stroke();
        ctx.beginPath();ctx.moveTo(SZ*.12,-SZ*.02);ctx.lineTo(SZ*.34,SZ*.22);ctx.stroke();
        ctx.restore();
      }
    }else{
      const w=Math.sin(q*.6+r*.5+1.8)*.5+.5;
      poly(q,r);ctx.fillStyle=`hsl(${33+w*14},${62+w*12}%,${44+w*20}%)`;ctx.fill();
      ctx.strokeStyle='rgba(90,45,0,.75)';ctx.lineWidth=1.5;ctx.stroke();
      const{x,y}=hp(q,r);
      const g=ctx.createRadialGradient(x-SZ*.22,y-SZ*.28,SZ*.04,x,y,SZ*.78);
      g.addColorStop(0,'rgba(255,210,70,.2)');g.addColorStop(1,'rgba(0,0,0,.18)');
      poly(q,r,.83);ctx.fillStyle=g;ctx.fill();
    }
  }

  // highlight reachable neighbors / next selectable positions
  const pulse=(Math.sin(performance.now()/260)+1)/2;
  for(const[dq,dr]of DIRS){
    const nq=bee.q+dq,nr=bee.r+dr,nk=K(nq,nr);
    if(cells.has(nk)&&cells.get(nk)==='E'){
      poly(nq,nr,.94);
      ctx.fillStyle=`rgba(255,220,70,${0.16+pulse*0.10})`;
      ctx.fill();
      poly(nq,nr,.98);
      ctx.strokeStyle=`rgba(255,232,120,${0.68+pulse*0.22})`;
      ctx.lineWidth=3.4;
      ctx.stroke();
      const{x,y}=hp(nq,nr);
      ctx.fillStyle=`rgba(255,245,170,${0.55+pulse*0.25})`;
      ctx.beginPath();ctx.arc(x,y,SZ*.13+pulse*SZ*.04,0,Math.PI*2);ctx.fill();
    }
  }
  if(pollenPos){
    const{x,y}=hp(pollenPos.q,pollenPos.r);
    const g=ctx.createRadialGradient(x,y,2,x,y,SZ*.9);
    g.addColorStop(0,'rgba(255,100,180,.4)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,SZ*.9,0,Math.PI*2);ctx.fill();
    ctx.font=`${SZ*.95}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#ff69b4';ctx.shadowBlur=20;ctx.fillText('🌸',x,y);ctx.shadowBlur=0;
  }

  const{x,y}=beeDraw||hp(bee.q,bee.r);
  ctx.save();
  ctx.translate(x,y);
  if(anim){ctx.rotate(Math.sin(performance.now()/80)*0.08)}
  ctx.font=`${SZ*1.05}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#ffd040';ctx.shadowBlur=18;ctx.fillText('🐝',0,0);ctx.restore();ctx.shadowBlur=0;

  drawGuideOverlay(pulse);
}

cv.addEventListener('pointerdown',e=>{
  if(!gameStarted)return;
  const rc=cv.getBoundingClientRect();
  const mx=(e.clientX-rc.left)*(W/rc.width),my=(e.clientY-rc.top)*(H/rc.height);
  let best=null,bd=SZ*1.4;
  for(const k of cells.keys()){
    const[q,r]=k.split(',').map(Number);
    const{x,y}=hp(q,r);
    const d=Math.hypot(mx-x,my-y);
    if(d<bd){bd=d;best={q,r}}
  }
  if(best){
    const dq=best.q-bee.q,dr=best.r-bee.r;
    if(!DIRS.some(([a,b])=>a===dq&&b===dr))return;
    if(showTapHint){
      const target=getGuideTarget();
      if(!target || best.q!==target.q || best.r!==target.r)return;
    }
    move(dq,dr);
  }
});

function loop(){
  if(!gameStarted){
    drawHoneycombBackground();
  }else if(!anim){
    render();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
