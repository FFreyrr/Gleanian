 "target": "f5edef94-45f4-494b-89c4-8011a5d23df3", "targetType": "elements"}]}, "f5edef94-45f4-494b-89c4-8011a5d23df3": {"id": "f5edef94-45f4-494b-89c4-8011a5d23df3", "title": "<p>convo nora coworker 24</p>", "titleText": "convo nora coworker 24", "content": "<p>Jenny: I know! But there’s never enough time, right? Every season there’s more work, more flowers, more dying plants to replace...</p><p>Nora: Have you noticed that too?</p>", "media": {"type": "video", "src": "assets/nora coworker talking_finale.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "d1c0e612-22b1-4b6c-812f-522f03260507", "label": "", "target": "6b1d2acd-c27f-4bf1-8f53-46970c77db31", "targetType": "elements"}]}, "12c21786-8fce-475b-b424-e70c33a5040c": {"id": "12c21786-8fce-475b-b424-e70c33a5040c", "title": "", "titleText": "", "content": "<p>Paul: I’m sorry, boy, but this all sounds a little unlikely. Maybe you should get yourself checked... you might have hit your head harder than you thought when you fell.</p>", "media": {"type": "video", "src": "assets/Paul talk with Harry.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "097889f7-c113-47c8-92e1-7f6d82969777", "label": "", "target": "40330f82-5074-4f18-9168-a88e281ad90e", "targetType": "elements"}]}, "6b1d2acd-c27f-4bf1-8f53-46970c77db31": {"id": "6b1d2acd-c27f-4bf1-8f53-46970c77db31", "title": "<p>convo nora coworker 26</p>", "titleText": "convo nora coworker 26", "content": "<p>Jenny: Everyone has... half the flowers we pollinate barely survive anymore.</p><p>Nora: And yet they keep increasing our workload.</p>", "media": {"type": "video", "src": "assets/nora coworker talking_finale.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "7c00e072-d990-4b72-8676-4806a0fbd5e0", "label": "", "target": "0865f9ec-0c34-4bd9-a1f6-27dff5cf6cf2", "targetType": "elements"}]}, "559fffc1-88f9-4e40-8a8d-9ebccdea4892": {"id": "559fffc1-88f9-4e40-8a8d-9ebccdea4892", "title": "", "titleText": "", "content": "<p>Paul: This could be more serious than I thought... I need to report it to the <em>Council</em> immediately.</p>", "media": {"type": "video", "src": "assets/Paul talk with Harry.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "746230df-caf0-4930-833c-ba4746758d51", "label": "", "target": "47de1e61-a986-4c82-b775-c5dbf2553dc1", "targetType": "elements"}]}, "0865f9ec-0c34-4bd9-a1f6-27dff5cf6cf2": {"id": "0865f9ec-0c34-4bd9-a1f6-27dff5cf6cf2", "title": "<p>convo nora coworker 28</p>", "titleText": "convo nora coworker 28", "content": "<p>Jenny: Because the garden is struggling... but instead of changing the system, they just expect us to work faster!</p><p>Nora: I don’t think even the birds know how bad things are getting.</p>", "media": {"type": "video", "src": "assets/nora coworker talking_finale.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "bc9b43a0-7b69-48ca-bfa1-b465fde25c7d", "label": "", "target": "f7300455-bfcd-4463-ba66-3878bf8385a6", "targetType": "elements"}]}, "9b5377c1-259a-4bc1-b5af-a7e49f9d6d9d": {"id": "9b5377c1-259a-4bc1-b5af-a7e49f9d6d9d", "title": "<p>Talking with John, Saul and Linda</p>", "titleText": "Talking with John, Saul and Linda", "content": "<p><em>During lunch break, Paul meets with John, Saul, and Linda to discuss the growing instability within the garden.</em></p><p><em>With resources becoming scarcer and workers increasingly exhausted, the conversation quickly shifts toward labor distribution and productivity.</em></p>", "media": {"type": "image", "src": "assets/John paul saul linda.jpeg", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "77fa76ea-c747-4cdb-87fe-4c1d07c4462e", "label": "", "target": "87462216-6589-49e8-abfd-2b7bd8fbb84f", "targetType": "elements"}]}, "f7300455-bfcd-4463-ba66-3878bf8385a6": {"id": "f7300455-bfcd-4463-ba66-3878bf8385a6", "title": "<p>convo nora coworker 30</p>", "titleText": "convo nora coworker 30", "content": "<p>Jenny: Some of them probably do. They just don’t have to carry it on their backs like we do.</p><p>Nora: ...</p>", "media": {"type": "video", "src": "assets/nora coworker talking_finale.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "72bb6799-142c-46b1-a4d3-90d83bd0eadf", "label": "", "target": "80f2b497-3932-4439-a3d7-34fe17cdb589", "targetType": "elements"}]}, "623ee8d7-c194-4e03-b493-965ed2d10c59": {"id": "623ee8d7-c194-4e03-b493-965ed2d10c59", "title": "<p>Convo with Paul about plants 17</p>", "titleText": "Convo with Paul about plants 17", "content": "<p>Nora: I just want things to get better.</p><p>Paul: Me too.</p>", "media": {"type": "video", "src": "assets/nora paul talking.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "6e89ecb3-44ae-45b6-9005-fc4e7a5814c7", "label": "", "target": "c10bd7a5-4285-4706-abf0-008da64f100e", "targetType": "elements"}]}, "f6c95ab6-34c8-4871-ba82-3f564bb2d11e": {"id": "f6c95ab6-34c8-4871-ba82-3f564bb2d11e", "title": "<p>Convo with Paul about the restored plant</p>", "titleText": "Convo with Paul about the restored plant", "content": "<p>Paul: I spoke with John earlier today after Nora mentioned the worsening conditions in the garden.</p><p>Harry: And what did he say?</p>", "media": {"type": "video", "src": "assets/nora harry paul talking.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "360460e9-5327-455e-b65a-e9acfe2fa3cc", "label": "", "target": "cd8005be-7974-4799-955a-efc13e0c5167", "targetType": "elements"}]}, "4fcd6583-a509-4059-a827-05c65895569e": {"id": "4fcd6583-a509-4059-a827-05c65895569e", "title": "<p>Convo with Paul about the restored plant</p>", "titleText": "Convo with Paul about the restored plant", "content": "<p>Paul: But honestly, the numbers haven’t been adding up for a while now.<br/>And after hearing this from both of you... I think there may actually be something happening inside the garden itself.</p><p>Harry: So what are you going to do?</p><p>Paul: ...</p>", "media": {"type": "video", "src": "assets/nora harry paul talking.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "29749dc2-b72e-4e40-b80b-14a6ba5d9f04", "label": "", "target": "42d5d19b-091c-451a-ab27-48a9da791cf8", "targetType": "elements"}]}, "b10b523b-7907-4f1a-bf47-d84715ed987b": {"id": "b10b523b-7907-4f1a-bf47-d84715ed987b", "title": "<p>Convo with Saul</p>", "titleText": "Convo with Saul", "content": "<p><em>Paul looks down, clearly uncertain.</em></p><p><em>Each perspective seems to offer a different solution to the same growing crisis.</em></p>", "media": {"type": "image", "src": "assets/John paul saul linda.jpeg", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "53769cb0-6439-4dc7-86a6-c7ebd5cebd23", "label": "<p><strong>Follow Saul’s Suggestion</strong><br/>Reduce the birds’ workload and place more responsibilities on the insects.</p>", "target": "ef1753cc-1b87-4bd1-b7c6-e9ea1937ae60", "targetType": "elements"}, {"id": "1e341e93-fa80-4852-b434-a4228713e5ca", "label": "<p><strong>Follow Linda’s Suggestion</strong><br/>Redistribute resources more equally to support exhausted workers.</p>", "target": "ef1753cc-1b87-4bd1-b7c6-e9ea1937ae60", "targetType": "elements"}, {"id": "a96f74f4-4904-4d8e-972e-369b5c7ad58a", "label": "<p><strong>Follow John’s Suggestion</strong><br/>Maintain the current structure and trust the existing system.</p>", "target": "ef1753cc-1b87-4bd1-b7c6-e9ea1937ae60", "targetType": "elements"}]}, "80f2b497-3932-4439-a3d7-34fe17cdb589": {"id": "80f2b497-3932-4439-a3d7-34fe17cdb589", "title": "<p>convo nora coworker 33</p>", "titleText": "convo nora coworker 33", "content": "<p>Jenny: Lunch break’s almost over.</p><p>Nora: Yeah. Back to work.</p>", "media": {"type": "video", "src": "assets/nora coworker talking_finale.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "895ca560-5d81-4fa3-9579-74bd813746f1", "label": "", "target": "27e4150a-15be-455d-8c76-5fd60bb2cf3a", "targetType": "elements"}]}, "0a7920b6-9a8a-4e08-bde0-aa76416ceb0d": {"id": "0a7920b6-9a8a-4e08-bde0-aa76416ceb0d", "title": "<p>Convo with Harry</p>", "titleText": "Convo with Harry", "content": "<p><em>While working, Paul is approached by a hummingbird he has never met before. The bird introduces himself as Harry, one of the workers managed by Saul.</em></p><p><em>Harry explains that earlier that day, he collapsed while working near the flower fields. One of Paul’s worker bumblebees, Jenny, stopped to help him. During the interaction, the two of them witnessed something impossible: a dying plant suddenly recovering before their eyes.</em></p>", "media": {"type": "video", "src": "assets/Paul talk with Harry.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "ca87e039-e694-4870-9875-529ebdc2aef1", "label": "", "target": "d5939e7c-f04f-4002-8f1e-f7894a469f5c", "targetType": "elements"}]}, "d6acc959-84aa-441e-9e6d-64d4068e054b": {"id": "d6acc959-84aa-441e-9e6d-64d4068e054b", "title": "<p>Convo with John</p>", "titleText": "Convo with John", "content": "<p>Linda: Does it really? Because from what Paul is describing, it sounds like the insects are carrying most of the burden while receiving the fewest resources.</p><p>Saul: Well, that’s because they’re supposed to handle the heavier workload.</p><p><em>Linda immediately frowns.</em></p>", "media": {"type": "image", "src": "assets/John paul saul linda.jpeg", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "aa3d2cf0-7a80-46da-9962-137fdf309944", "label": "", "target": "3ef5df3f-6eb9-4194-b1f8-eac7a90a2a71", "targetType": "elements"}]}, "a37199b8-f95a-40d4-a099-a79bb2cd71c1": {"id": "a37199b8-f95a-40d4-a099-a79bb2cd71c1", "title": "<p>PAUL'S MINIGAME</p>", "titleText": "PAUL'S MINIGAME", "content": "", "media": null, "outputs": [{"id": "ed90fbe7-bb4b-48ed-b43e-d97f62fd4744", "label": "", "target": "cf706caf-21da-44dc-b028-60b93ffffd78", "targetType": "elements"}]}, "e081ad47-02bd-41e0-9692-9e9d67c66f4c": {"id": "e081ad47-02bd-41e0-9692-9e9d67c66f4c", "title": "<p>PAUL'S MINIGAME</p>", "titleText": "PAUL'S MINIGAME", "content": "", "media": null, "outputs": [{"id": "f45f0ec0-f948-4f22-ae99-a6d53dbef94b", "label": "", "target": "e89e0698-aca1-4a76-b151-1a954eec574b", "targetType": "elements"}]}, "6d0b3979-7a46-4009-8fe8-64cf25e7ffa3": {"id": "6d0b3979-7a46-4009-8fe8-64cf25e7ffa3", "title": "", "titleText": "", "content": "<p><em>The following day...</em></p>", "media": null, "outputs": [{"id": "dce01509-54bd-4178-869d-d927f8d0aed3", "label": "", "target": "c1d4833d-a469-4c20-9fc7-85cb3ad826ba", "targetType": "elements"}]}, "4a4feeef-226e-434c-9189-801432de1520": {"id": "4a4feeef-226e-434c-9189-801432de1520", "title": "<p>Eshu talking</p>", "titleText": "Eshu talking", "content": "<p>Eshu: What is this nonsense? Plants magically restoring themselves? Do you even hear what you are saying?</p><p>You know what I believe? I believe this garden - our home - needs everyone to work harder and focus on the roles they were assigned.</p><p>For years, the system worked perfectly fine. And now suddenly plants are withering, resources are becoming scarce...</p><p>Plants do not recover by standing around imagining miracles. They survive because workers do their jobs.</p><p>The ants maintain the soil.<br/>The bumblebees and hummingbirds pollinate the flowers.<br/>And you, Paul, are supposed to make sure the system keeps functioning properly.</p><p>Enough with these distractions.<br/>Dismiss this nonsense and return to work.</p>", "media": {"type": "image", "src": "assets/chapter_Parrot_Eshu.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "f4573d3e-fafe-4535-a2f2-9b4f27b5bf67", "label": "", "target": "b014ce23-cd85-4018-a585-fdda6424ecd3", "targetType": "elements"}]}, "3a74b3e9-bc84-4c6d-9b29-ad30aae66947": {"id": "3a74b3e9-bc84-4c6d-9b29-ad30aae66947", "title": "<p>Paul to the council </p>", "titleText": "Paul to the council", "content": "<p><em>Paul requests an urgent meeting with the Council and explains everything Nora and Harry witnessed near the flower fields, including the sudden recovery of the dying plant and the worsening instability spreading through the garden.</em></p><p><em>The room quickly fills with confusion and disagreement. Some Council members seem uncertain, while others immediately dismiss the story as impossible.</em></p><p><em>Then Eshu, leader of the Council, finally speaks.</em></p><p><em>The entire room falls silent.</em></p>", "media": null, "outputs": [{"id": "a6246b16-0a41-4888-b499-cf3f7575c4bd", "label": "", "target": "4a4feeef-226e-434c-9189-801432de1520", "targetType": "elements"}]}, "d51d20cf-b805-49d3-98ba-868758c7f630": {"id": "d51d20cf-b805-49d3-98ba-868758c7f630", "title": "", "titleText": "", "content": "<p><em>Paul decides not to give too much importance to the story and returns to his routine.</em></p><p><em>There is still work to organize, and tomorrow’s tasks for the bumblebee workers need to be prepared before the end of the day.</em></p>", "media": null, "outputs": [{"id": "6d8929d3-bf43-4985-a24f-4751140a04f9", "label": "", "target": "e0872a51-00b1-43ba-a302-978b1df9ef99", "targetType": "elements"}]}, "e0872a51-00b1-43ba-a302-978b1df9ef99": {"id": "e0872a51-00b1-43ba-a302-978b1df9ef99", "title": "<p>Chapter 2</p>", "titleText": "Chapter 2", "content": "<p><strong>CHAPTER 2</strong></p>", "media": {"type": "image", "src": "assets/chapter_Harry_POV.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "7e56de6c-d360-4176-9fb0-934add4916d4", "label": "", "target": "6d0b3979-7a46-4009-8fe8-64cf25e7ffa3", "targetType": "elements"}]}, "96b3dadd-5e21-4b97-a398-5ba106ce6e34": {"id": "96b3dadd-5e21-4b97-a398-5ba106ce6e34", "title": "", "titleText": "", "content": "<p>Paul: I understand why this seems important to both of you, but this all sounds a little unrealistic. You’ve both been under a lot of stress lately.</p>", "media": null, "outputs": [{"id": "13c16790-760b-4b5d-b189-ee3e4a8256d4", "label": "", "target": "d51d20cf-b805-49d3-98ba-868758c7f630", "targetType": "elements"}]}, "72c6b286-20f2-45f4-9e6d-9543f0f86921": {"id": "72c6b286-20f2-45f4-9e6d-9543f0f86921", "title": "", "titleText": "", "content": "<p>Paul: This could be more serious than I thought... I need to report it to the <em>Council</em> immediately.</p>", "media": null, "outputs": [{"id": "eb58e139-63eb-4033-b63d-f08a1f81e3dd", "label": "", "target": "3a74b3e9-bc84-4c6d-9b29-ad30aae66947", "targetType": "elements"}]}, "c1d4833d-a469-4c20-9fc7-85cb3ad826ba": {"id": "c1d4833d-a469-4c20-9fc7-85cb3ad826ba", "title": "<p>HARRY'S POV</p>", "titleText": "HARRY'S POV", "content": "<p><em>After the events of the previous day, Harry cannot stop thinking about the withering plants and the strange recoveries he witnessed. Despite his growing concerns, he still has to return to work. Life as a hummingbird is exhausting in its own way: constant movement, unstable sugar levels, and the pressure to remain productive at all times.</em></p><p><em>Still, Harry realizes that insect workers have it even worse. Bumblebees and ants work endlessly while receiving fewer resources, less recognition, and almost no influence over the decisions shaping the garden.</em></p><p><em>Influenced by the Council discussion, Harry decides to question Saul about these inequalities. Saul immediately dismisses his concerns, insisting that insects are naturally weaker and less capable, and therefore destined to remain at the bottom of the system. Through this interaction, Harry begins to understand how hierarchy and exclusion are normalized within the garden.</em></p><p><em>Later that day, Harry helps an exhausted insect worker and once again witnesses a dying plant suddenly recover nearby. The phenomenon no longer feels accidental.</em></p><p><em>Shortly after, while working near the flower fields, Harry notices another withering plant alongside Terra, an ant worker he already knows. Disturbed by the repetition of these events, he decides to report the situation to one of the supervisors, hoping someone in authority will finally take the issue seriously.</em></p><p><em>Only afterwards does Harry meet Terra again. The two begin discussing the worsening condition of the garden and the strange phenomenon they both witnessed. During the conversation, Terra reveals old rumors she heard from the ant colony about the termites - a species believed to have disappeared long ago, connected to forgotten knowledge hidden beneath the garden.</em></p><p><em>For the first time, Harry begins questioning not only the imbalance of resources, but also who controls knowledge within the system - and why certain truths seem to be intentionally ignored.</em></p>", "media": {"type": "image", "src": "assets/chapter_Harry_POV.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "bbc9fa1e-352b-468f-85e6-be5981ecae5e", "label": "", "target": "06abfea0-bb5d-476b-8883-ffac0a93ce07", "targetType": "elements"}]}, "b014ce23-cd85-4018-a585-fdda6424ecd3": {"id": "b014ce23-cd85-4018-a585-fdda6424ecd3", "title": "<p>Transition to ch. 2</p>", "titleText": "Transition to ch. 2", "content": "<p><em>The Council members begin applauding Eshu’s speech, and the discussion quickly comes to an end.</em></p><p><em>With no room left for further debate, Paul quietly returns to work.</em></p>", "media": {"type": "image", "src": "assets/chapter_Harry_POV.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "7be3b4e7-a1e5-4537-a32c-60a45e08a1c7", "label": "", "target": "e0872a51-00b1-43ba-a302-978b1df9ef99", "targetType": "elements"}]}, "f55777b5-af8d-46a1-a52a-dc2badde9e76": {"id": "f55777b5-af8d-46a1-a52a-dc2badde9e76", "title": "<p>Eshu talking</p>", "titleText": "Eshu talking", "content": "<p>Eshu: What is this nonsense? Plants magically restoring themselves? Do you even hear what you are saying?</p><p>You know what I believe? I believe this garden - our home - needs everyone to work harder and focus on the roles they were assigned.</p><p>For years, the system worked perfectly fine. And now suddenly plants are withering, resources are becoming scarce...</p><p>Plants do not recover by standing around imagining miracles. They survive because workers do their jobs.</p><p>The ants maintain the soil.<br/>The bumblebees and hummingbirds pollinate the flowers.<br/>And you, Paul, are supposed to make sure the system keeps functioning properly.</p><p>Enough with these distractions.<br/>Dismiss this nonsense and return to work.</p>", "media": {"type": "image", "src": "assets/chapter_Parrot_Eshu.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "45223654-4f9b-427d-b221-b16ec718bb82", "label": "", "target": "b014ce23-cd85-4018-a585-fdda6424ecd3", "targetType": "elements"}]}, "a2dc07fb-777c-4fcf-be58-1f830b977e84": {"id": "a2dc07fb-777c-4fcf-be58-1f830b977e84", "title": "<p>Paul to the council </p>", "titleText": "Paul to the council", "content": "<p><em>Paul requests an urgent meeting with the Council and explains everything Nora told him about the strange recovery of the plant and the worsening instability spreading through the garden.</em></p><p><em>The room quickly fills with confusion and disagreement. Some Council members seem uncertain, while others immediately dismiss the story as impossible.</em></p><p><em>Then Eshu, leader of the Council, finally speaks.</em></p><p><em>The entire room falls silent.</em></p>", "media": null, "outputs": [{"id": "b774606d-5586-4cd3-92be-aee694ae98eb", "label": "", "target": "f55777b5-af8d-46a1-a52a-dc2badde9e76", "targetType": "elements"}]}, "140d46bb-d397-47a3-ad5a-af4f4668d1d0": {"id": "140d46bb-d397-47a3-ad5a-af4f4668d1d0", "title": "", "titleText": "", "content": "<p><em>Paul decides not to give too much importance to the story and returns to his routine.</em></p><p><em>There is still work to organize, and tomorrow’s tasks for the bumblebee workers need to be prepared before the end of the day.</em></p>", "media": null, "outputs": [{"id": "bcb39831-5b8a-43bb-a7d6-47160839188f", "label": "", "target": "5deb99b5-476d-4976-9734-4cf83a7426ba", "targetType": "elements"}]}, "5deb99b5-476d-4976-9734-4cf83a7426ba": {"id": "5deb99b5-476d-4976-9734-4cf83a7426ba", "title": "<p>Chapter 2</p>", "titleText": "Chapter 2", "content": "<p>Chapter 2</p>", "media": {"type": "image", "src": "assets/chapter_Harry_POV.png", "autoplay": false, "loop": false, "controls": false}, "outputs": []}, "70c33f13-603c-4b3c-9f4c-75d8daa2cfc7": {"id": "70c33f13-603c-4b3c-9f4c-75d8daa2cfc7", "title": "", "titleText": "", "content": "<p>Paul: Nora... I understand why this seems important to you, but it’s probably just a misunderstanding. You’ve been under a lot of pressure lately.</p>", "media": null, "outputs": [{"id": "37b89754-4a63-4385-8e3a-3b2552eee085", "label": "", "target": "140d46bb-d397-47a3-ad5a-af4f4668d1d0", "targetType": "elements"}]}, "0f496e05-e3b5-451f-8393-e5b257b46f47": {"id": "0f496e05-e3b5-451f-8393-e5b257b46f47", "title": "", "titleText": "", "content": "<p>Paul: This could be more serious than I thought... I need to report it to the <em>Council</em> immediately.</p>", "media": null, "outputs": [{"id": "fdab5765-19aa-48bc-adac-a64a125c623a", "label": "", "target": "a2dc07fb-777c-4fcf-be58-1f830b977e84", "targetType": "elements"}]}, "df313750-5936-4965-aad8-a3b808de287a": {"id": "df313750-5936-4965-aad8-a3b808de287a", "title": "<p>Convo with Nora</p>", "titleText": "Convo with Nora", "content": "<p><em>The story catches Paul off guard. Over the past few weeks, he had already noticed inconsistencies in the garden’s reports and briefly discussed them with his supervisor, but nothing concrete had come out of it.</em></p><p><em>Now, faced with Nora’s account, he is left uncertain about what to think.</em></p>", "media": {"type": "video", "src": "assets/nora paul talking.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "67661441-299d-415a-a849-81743fbe9617", "label": "", "target": "2a5eb342-4ba0-4eea-8180-2cce75cf6f18", "targetType": "elements"}]}, "2a5eb342-4ba0-4eea-8180-2cce75cf6f18": {"id": "2a5eb342-4ba0-4eea-8180-2cce75cf6f18", "title": "<p>Convo with Nora</p>", "titleText": "Convo with Nora", "content": "<p><em>Nora looks at him for a moment...</em></p><p>Nora: So... what happens now?</p>", "media": {"type": "video", "src": "assets/nora paul talking.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "7ef22834-bf31-45a1-ae4d-abc0003157ab", "label": "<p><strong>Assume Nora misunderstood the situation</strong> and focus on keeping the system running normally.</p>", "target": "70c33f13-603c-4b3c-9f4c-75d8daa2cfc7", "targetType": "elements"}, {"id": "fe2dbf38-3102-47d5-b864-ca5853d146be", "label": "<p><strong>Take her story seriously</strong> - this discovery could explain what is happening in the garden.</p>", "target": "0f496e05-e3b5-451f-8393-e5b257b46f47", "targetType": "elements"}]}, "06abfea0-bb5d-476b-8883-ffac0a93ce07": {"id": "06abfea0-bb5d-476b-8883-ffac0a93ce07", "title": "", "titleText": "", "content": "<p><em>Earlier that day...</em></p>", "media": null, "outputs": [{"id": "c8e07fb4-8ad3-4586-bef9-dc6b1b33b7e3", "label": "", "target": "c4c4d371-b690-415e-9b91-f47ac392c1bd", "targetType": "elements"}]}, "c4c4d371-b690-415e-9b91-f47ac392c1bd": {"id": "c4c4d371-b690-415e-9b91-f47ac392c1bd", "title": "<p>TERRA'S POV</p>", "titleText": "TERRA'S POV", "content": "<p><em>Terra wakes up determined to understand why the garden’s soil has started losing its strength. As an ant worker, she has spent her entire life maintaining and studying the underground systems that keep the ecosystem alive - knowledge carefully passed down through generations within the colony.</em></p><p><em>While working near the flower fields, Terra notices a plant beginning to wither. Harry, a hummingbird she has occasionally worked alongside before, witnesses the same scene with her. The instability spreading through the garden is becoming impossible to ignore.</em></p><p><em>Concerned by the worsening condition of the soil, Terra begins discussing possible solutions with another ant coworker. Together, they reflect on how the ants are the ones responsible for understanding and maintaining the soil, yet their knowledge is rarely acknowledged or included in the larger decisions shaping the garden.</em></p><p><em>Hoping someone in power will finally listen, Terra brings her concerns and ideas to Saul. However, the conversation is quickly dismissed in favor of productivity and keeping the system functioning as efficiently as possible.</em></p><p><em>Realizing the problem may be deeper than anyone is willing to admit, Terra decides to speak directly with the Ant Queen. There, she learns about a species believed to have disappeared long ago: the termites. According to old stories and forgotten knowledge, termites once possessed a deep understanding of balance, decomposition, and the hidden history of the garden - and they might know how to restore the soil.</em></p><p><em>Driven by curiosity and concern for the future of the ecosystem, Terra begins investigating the termites and later shares what she discovered with Harry.</em></p>", "media": {"type": "image", "src": "assets/chapter_Terra_POV.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "0eaf6d1d-6e2d-4e58-8847-44a66a45c262", "label": "", "target": "91c4fdba-1896-479e-bba7-47b9518b5c37", "targetType": "elements"}]}, "ffe6382b-810b-4ae5-b12f-7e2a298f892a": {"id": "ffe6382b-810b-4ae5-b12f-7e2a298f892a", "title": "<p>Convo with Nora and Harry</p>", "titleText": "Convo with Nora and Harry", "content": "<p><em>The conversation comes to an end.</em></p><p>Harry: So... what are you going to do?</p>", "media": {"type": "video", "src": "assets/paulnoraharrytalking.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "833e535d-f6c2-441c-9f1c-9e4de83e2cb5", "label": "<p><strong>Assume Nora and Harry misunderstood</strong> the situation and focus on keeping the system running normally.</p>", "target": "96b3dadd-5e21-4b97-a398-5ba106ce6e34", "targetType": "elements"}, {"id": "538174cc-77ae-4ee7-a514-79be376cf9ad", "label": "<p><strong>Take their story seriously</strong> - this discovery could explain what is happening in the garden.</p>", "target": "72c6b286-20f2-45f4-9e6d-9543f0f86921", "targetType": "elements"}]}, "5e4e2b46-c33e-4db1-abae-ded53a546bf2": {"id": "5e4e2b46-c33e-4db1-abae-ded53a546bf2", "title": "<p>Convo with Nora and Harry</p>", "titleText": "Convo with Nora and Harry", "content": "<p><em>At first, Paul struggles to process the story. Over the past few weeks, he had already noticed irregularities in the garden’s reports and briefly discussed them with his supervisor, but the concerns had been quickly dismissed.</em></p><p><em>However, hearing the same impossible event described by both Nora and Harry makes the situation much harder to ignore.</em></p>", "media": {"type": "video", "src": "assets/paulnoraharrytalking.mp4", "autoplay": true, "loop": true, "controls": false}, "outputs": [{"id": "37b4abbf-b3e8-4120-9d73-16fc124e1472", "label": "", "target": "ffe6382b-810b-4ae5-b12f-7e2a298f892a", "targetType": "elements"}]}, "23ea189e-d8ea-44e2-a7df-85c6759015a1": {"id": "23ea189e-d8ea-44e2-a7df-85c6759015a1", "title": "<p>GOOD ENDING</p>", "titleText": "GOOD ENDING", "content": "<p><em>The remaining characters enter the tree and learn the truth from Xylia, the termite queen. She tells them that the garden was never the birds' alone. Long ago, there were two gardens — one of birds, one of insects — and both were lost to disaster. The survivors of each fled, and by chance found their way to the same new ground. They built it together, and swore to tend it together, so that what had happened before would not happen again. But insects live and die quickly, and within a few generations their memory of the founding had thinned. The birds, who lived longer, noticed — and rewrote the story. They named their own ancestors as the first planters, and from that telling came everything that followed: the ownership, the hierarchy, the tolerated and the tolerating. </em></p><p><em>They bring it to the council, where they confront Eshu in front of everyone. A flashback opens onto Eshu's past: his forced departure from the birds' previous garden, his arrival in the new one alongside the insects, and his fearful pact with the rebel parrots to rewrite the story - terrified that he and his kind would be cast out again.<br/>After the flashback, Eshu admits the truth. He explains that he only wanted to save his family and his species, and to protect the new garden. The main characters tell the council how the plants began to restore the moment birds and insects helped each other, and the council resolves to cooperate more closely with the insects. As time passes, Elegua becomes the council's leader and sets about renovating the garden's structure. Every sector - the Council included - begins to include every species, and the garden, slowly, comes back to life.</em></p>", "media": {"type": "image", "src": "assets/chapter_BumblebeeQueen.png", "autoplay": false, "loop": false, "controls": false}, "outputs": []}, "04961511-16f2-43c3-9fee-cae870bce417": {"id": "04961511-16f2-43c3-9fee-cae870bce417", "title": "<p>BAD ENDING</p>", "titleText": "BAD ENDING", "content": "<p><em>The remaining characters can't get into the termites' tree, and the truth stays buried with it. They return to their homes, but nothing shifts. The garden keeps deteriorating as the climate worsens, until it finally dies - and every species is forced to leave in search of another garden to live in.</em></p>", "media": {"type": "image", "src": "assets/chapter_Woodpecker.png", "autoplay": false, "loop": false, "controls": false}, "outputs": []}, "077fc4be-24bb-4426-ba3f-ce8d0ffa2259": {"id": "077fc4be-24bb-4426-ba3f-ce8d0ffa2259", "title": "<p>FINAL GAME</p>", "titleText": "FINAL GAME", "content": "", "media": null, "outputs": [{"id": "430f519d-6876-4722-8f8b-8246f729058e", "label": "", "target": "c6008114-61f8-434d-9605-92de370e5b73", "targetType": "branches"}]}, "91c4fdba-1896-479e-bba7-47b9518b5c37": {"id": "91c4fdba-1896-479e-bba7-47b9518b5c37", "title": "", "titleText": "", "content": "<p><em>Harry and Terra decide to go talk with a supervisor that tells them to go talk with Elegua and Eloween.</em></p>", "media": null, "outputs": [{"id": "9a13bb4e-7c2f-4070-abb5-2cce08569e87", "label": "", "target": "778d9bbb-7849-4b72-9039-ee41eac1e18a", "targetType": "elements"}]}, "778d9bbb-7849-4b72-9039-ee41eac1e18a": {"id": "778d9bbb-7849-4b72-9039-ee41eac1e18a", "title": "<p>CHAPTER 3</p>", "titleText": "CHAPTER 3", "content": "<p><strong>CHAPTER 3</strong></p>", "media": {"type": "image", "src": "assets/chapter_Elegua_POV.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "d3cd8f7c-d344-4ee2-9ee8-88f09dff4136", "label": "", "target": "07e00eaf-9a32-4a49-8bf6-afe4f4791f20", "targetType": "elements"}]}, "d3ee8944-df39-47b0-baa4-776270fd5fc2": {"id": "d3ee8944-df39-47b0-baa4-776270fd5fc2", "title": "<p>ELEGUA'S POV</p>", "titleText": "ELEGUA'S POV", "content": "<p><em>As the future successor of the Council, Elegua spends his days learning directly from Eshu, leader of the birds and his grandfather. Raised within the center of power, Elegua has always lived surrounded by privilege, authority, and the expectation of one day maintaining the order of the garden himself.</em></p><p><em>Throughout the day, Eshu teaches him how the system is structured and what it means to lead. According to him, every species has a predefined role within society, and stability can only exist when everyone remains in their assigned place.</em></p><p><em>During one of their conversations, Eshu explains that insects are naturally inferior because of their shorter life spans, their perceived fragility, and their inability to preserve knowledge over time in the same way birds do. He insists that maintaining hierarchy and control is necessary for the survival and prosperity of the garden.</em></p><p><em>Eshu repeatedly reminds Elegua that leadership is not about questioning the system, but about protecting it and ensuring productivity and order above all else.</em></p><p><em>Later in the day, the conversation shifts toward the termites - a species never mentioned openly within the garden. Eshu explains that termites were marginalized long ago because they were considered a source of disorder within the garden, constantly disrupting the balance and stability of the system. He reassures Elegua that the woodpeckers are still monitoring them in secrecy to prevent future problems.</em></p><p><em>Although Elegua initially accepts these explanations, the discussion leaves him unsettled. Wanting another perspective, he later shares what he learned with Eloween, a butterfly member of the Council and one of the few people he genuinely trusts.</em></p>", "media": {"type": "image", "src": "assets/chapter_Elegua_POV.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "65e41621-ec15-4eed-9048-56714850f935", "label": "", "target": "19e9933e-0e15-40ef-9c2c-d4a0b95df930", "targetType": "elements"}]}, "07e00eaf-9a32-4a49-8bf6-afe4f4791f20": {"id": "07e00eaf-9a32-4a49-8bf6-afe4f4791f20", "title": "", "titleText": "", "content": "<p><em>Earlier that day...</em></p>", "media": null, "outputs": [{"id": "e4267fc9-1489-4098-963b-39a031e6a3e9", "label": "", "target": "d3ee8944-df39-47b0-baa4-776270fd5fc2", "targetType": "elements"}]}, "19e9933e-0e15-40ef-9c2c-d4a0b95df930": {"id": "19e9933e-0e15-40ef-9c2c-d4a0b95df930", "title": "", "titleText": "", "content": "<p><em>Earlier that day...</em></p>", "media": null, "outputs": [{"id": "4b995e6f-ecef-4a9f-85f9-1538956a53e1", "label": "", "target": "efe686d7-8ebd-421e-80ea-5f80e095dd99", "targetType": "elements"}]}, "efe686d7-8ebd-421e-80ea-5f80e095dd99": {"id": "efe686d7-8ebd-421e-80ea-5f80e095dd99", "title": "<p>ELOWEEN'S POV</p>", "titleText": "ELOWEEN'S POV", "content": "<p><em>As one of the few insects allowed inside the Council, Eloween lives in a constant contradiction. Officially, she is part of the garden’s decision-making system; in reality, her presence is often treated as symbolic rather than influential.</em></p><p><em>Throughout the day, Eloween witnesses the growing tension between birds and insects within the Council chambers. Discussions about productivity, resources, and the worsening condition of the garden continue to intensify, yet insect perspectives are repeatedly ignored or dismissed.</em></p><p><em>Concerned by the increasing number of withering plants, Eloween attempts to bring the issue to the Council’s attention. However, her intervention is quickly interrupted, and the conversation shifts back toward maintaining efficiency and preserving order within the system.</em></p><p><em>Despite being directly connected to the parts of the ecosystem most affected by the crisis, Eloween realizes she has very little real influence over the decisions being made. Control over resources and information remains concentrated in the hands of the birds, even when insects are the ones most involved in sustaining the garden itself.</em></p><p><em>Later that day, Eloween accidentally overhears Eshu giving instructions to the woodpeckers about keeping the termites under strict control and preventing them from interfering with the stability of the garden.<br/>Disturbed by the secrecy surrounding the termites, Eloween later decides to speak with Elegua, one of the few Council members she truly trusts.</em></p><p><em>Their conversation quickly turns into a series of questions neither of them can answer. Who are the termites? Why has no one ever spoken about them before? And what kind of knowledge could be considered so dangerous that the entire garden seems determined to hide it?</em></p>", "media": {"type": "image", "src": "assets/chapter_Elowen_POV.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "71727736-995c-4314-a549-32e0a07db62b", "label": "", "target": "18729602-ef4f-4cbd-af7e-5d9d3472ada5", "targetType": "elements"}]}, "18729602-ef4f-4cbd-af7e-5d9d3472ada5": {"id": "18729602-ef4f-4cbd-af7e-5d9d3472ada5", "title": "", "titleText": "", "content": "<p><em>Elegua and Eloween decide to talk with the ones who directly witnessed the strange plant recoveries. Together, they exchange everything they saw and heard throughout the past days.</em></p><p><em>One thing becomes clear: the termites know something they don’t.</em></p><p><em>Determined to uncover the truth, the group decides to reach the Termite Tree — the only tree constantly surrounded by woodpeckers, and the only place strictly forbidden by the Council.</em></p><p><em>But there’s a problem.</em></p><p><em>They need to get inside without being stopped by the guards. The plan is simple: the insects must sneak into the tree, while the birds distract the woodpeckers outside.</em></p><p><em>For the plan to work, everyone will have to trust each other.</em></p><p><em>Will they manage to make it inside?</em></p>", "media": {"type": "image", "src": "assets/chapter_Woodpecker.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "12cea7a8-83d7-4ced-ac8e-8e5dbe78009b", "label": "", "target": "1384c04b-b235-4cc6-9274-5f17d1e1bf15", "targetType": "elements"}]}, "1384c04b-b235-4cc6-9274-5f17d1e1bf15": {"id": "1384c04b-b235-4cc6-9274-5f17d1e1bf15", "title": "<p>CHAPTER 4</p>", "titleText": "CHAPTER 4", "content": "<p>Chapter 4</p>", "media": {"type": "image", "src": "assets/chapter_Woodpecker.png", "autoplay": false, "loop": false, "controls": false}, "outputs": [{"id": "b9ff1749-c73e-42f0-af9c-138fb2704be6", "label": "", "target": "077fc4be-24bb-4426-ba3f-ce8d0ffa2259", "targetType": "elements"}]}}, "branches": {"c6008114-61f8-434d-9605-92de370e5b73": {"if": {"conditionId": "e67a3583-80c6-42a7-b3ad-ebfbd1578726", "script": "player wins game", "target": "23ea189e-d8ea-44e2-a7df-85c6759015a1"}, "else": {"conditionId": "38328be9-34ee-42b5-98b0-206895c77191", "script": null, "target": "04961511-16f2-43c3-9fee-cae870bce417"}}}, "stats": {"nodes": 140, "connections": 150, "assets": 27}};
function initializeCoverNodes() {
  const coverAssets = {
    game: 'assets/covers/game-cover.png',
    chapter1: 'assets/covers/chapter-1-cover.png',
    nora: 'assets/covers/nora-cover.png',
    paul: 'assets/covers/paul-cover.png',
    chapter2: 'assets/covers/chapter-2-cover.png',
    harry: 'assets/covers/harry-cover.png',
    terra: 'assets/covers/terra-cover.png',
    chapter3: 'assets/covers/chapter-3-cover.png',
    elegua: 'assets/covers/elegua-cover.png',
    elowen: 'assets/covers/elowen-cover.png',
    chapter4: 'assets/covers/chapter-4-cover.png'
  };
  const outputTo = target => [{ id: `cover-output-${target}`, label: '', target, targetType: 'elements' }];
  const coverActionLabel = titleText => {
    const title = titleText.replace(/\s*Cover\s*$/i, '').trim();
    if (/^game$/i.test(title)) return 'Start';
    if (/^chapter\s+\d+/i.test(title)) return `Enter ${title.replace(/\bchapter\b/i, 'Chapter')}`;
    return `Play as ${title}`;
  };
  const applyCover = (node, titleText, src, target) => {
    if (!node) return;
    node.title = `<p>${titleText}</p>`;
    node.titleText = titleText;
    node.content = '';
    node.media = { type: 'image', src, autoplay: false, loop: false, controls: false };
    node.coverPage = true;
    node.coverActionLabel = coverActionLabel(titleText);
    if (target) node.outputs = outputTo(target);
  };
  const createCover = (id, titleText, src, target) => {
    const coverTheme = /paul|harry|terra|elegua|elowen|chapter 2|chapter 3|chapter 4/i.test(titleText) ? 'paul' : 'nora';
    GAME.nodes[id] = {
      id,
      title: `<p>${titleText}</p>`,
      titleText,
      content: '',
      media: { type: 'image', src, autoplay: false, loop: false, controls: false },
      outputs: outputTo(target),
      coverPage: true,
      coverActionLabel: coverActionLabel(titleText),
      coverTheme
    };
  };
  const insertAfter = (sourceId, coverId, titleText, src) => {
    const source = GAME.nodes[sourceId];
    const firstOutput = source?.outputs?.[0];
    if (!firstOutput || firstOutput.target === coverId) return;
    createCover(coverId, titleText, src, firstOutput.target);
    firstOutput.target = coverId;
    firstOutput.targetType = 'elements';
    firstOutput.label = '';
  };
  const insertBefore = (targetId, coverId, titleText, src) => {
    if (GAME.nodes[coverId]) return;
    createCover(coverId, titleText, src, targetId);
    Object.values(GAME.nodes).forEach(node => {
      if (node.id === coverId) return;
      (node.outputs || []).forEach(out => {
        if (out.target === targetId && out.targetType === 'elements') {
          out.target = coverId;
          out.label = '';
        }
      });
    });
  };

  const originalStart = GAME.start;
  createCover('cover-game', 'Game Cover', coverAssets.game, originalStart);
  GAME.start = 'cover-game';

  applyCover(GAME.nodes['edc23337-3332-4e8f-b4a2-d90e5b104fa2'], 'Chapter 1 Cover', coverAssets.chapter1);
  insertAfter('edc23337-3332-4e8f-b4a2-d90e5b104fa2', 'cover-nora', 'Nora Cover', coverAssets.nora);

  insertBefore('98ab1c5c-506b-4dd4-be6b-866f7ce376eb', 'cover-paul-v1', 'Paul Cover', coverAssets.paul);
  insertBefore('ae61045a-fd0e-4f02-9b18-e98e53c5df24', 'cover-paul-v2', 'Paul Cover', coverAssets.paul);
  insertBefore('2735953e-d246-4d21-8aed-78f8bfff16e9', 'cover-paul-v3', 'Paul Cover', coverAssets.paul);

  applyCover(GAME.nodes['e0872a51-00b1-43ba-a302-978b1df9ef99'], 'Chapter 2 Cover', coverAssets.chapter2);
  insertAfter('e0872a51-00b1-43ba-a302-978b1df9ef99', 'cover-harry', 'Harry Cover', coverAssets.harry);
  insertBefore('c4c4d371-b690-415e-9b91-f47ac392c1bd', 'cover-terra', 'Terra Cover', coverAssets.terra);

  applyCover(GAME.nodes['778d9bbb-7849-4b72-9039-ee41eac1e18a'], 'Chapter 3 Cover', coverAssets.chapter3);
  insertAfter('778d9bbb-7849-4b72-9039-ee41eac1e18a', 'cover-elegua', 'Elegua Cover', coverAssets.elegua);
  insertBefore('efe686d7-8ebd-421e-80ea-5f80e095dd99', 'cover-elowen', 'Elowen Cover', coverAssets.elowen);

  applyCover(GAME.nodes['1384c04b-b235-4cc6-9274-5f17d1e1bf15'], 'Chapter 4 Cover', coverAssets.chapter4);

  Object.values(coverAssets).forEach(src => {
    const img = new Image();
    img.decoding = 'async';
    img.src = src;
  });
}
initializeCoverNodes();

const urlStartId = new URLSearchParams(window.location.search).get('start');
let currentId = GAME.nodes[urlStartId] ? urlStartId : GAME.start;
let stack = [];
let visitedTitles = [];
let activeAutoOutput = null;
let isTransitioning = false;
const completedMinigames = new Set();

const projectName = document.getElementById('projectName');
const meta = document.getElementById('meta');
const media = document.getElementById('media');
const titleEl = document.getElementById('title');
const contentEl = document.getElementById('content');
const choicesEl = document.getElementById('choices');
const endBox = document.getElementById('endBox');
const branchBox = document.getElementById('branchBox');
const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');
const adminToggle = document.getElementById('adminToggle');
const adminPanel = document.getElementById('adminPanel');
const adminCloseBtn = document.getElementById('adminCloseBtn');
const nodeSearch = document.getElementById('nodeSearch');
const nodeJumpSelect = document.getElementById('nodeJumpSelect');
const nodeJumpBtn = document.getElementById('nodeJumpBtn');

function strip(html) {
  const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent.trim();
}
function cleanTitle(text) {
  return (text || '')
    .replace(/^convo\s*(with)?\s*/i, '')
    .replace(/^convo\s*/i, '')
    .trim();
}
function encodeSrc(src) {
  if (/^https?:\/\//i.test(src)) return src;
  return src.split('/').map((part,i)=> i===0 ? part : encodeURIComponent(part)).join('/');
}
function googleDrivePreviewSrc(src) {
  const match = String(src || '').match(/drive\.google\.com\/file\/d\/([^/]+)/i);
  return match ? `https://drive.google.com/file/d/${match[1]}/preview` : '';
}
function normalizedTitle(node) {
  return (node?.titleText || '').trim().toUpperCase().replace(/\s+/g, ' ');
}
function isNorahMiniGame(node) {
  return normalizedTitle(node) === 'NORAMINIGAME';
}
function isPaulMiniGame(node) {
  return normalizedTitle(node) === "PAUL'S MINIGAME" || normalizedTitle(node) === 'PAULS MINIGAME';
}
function isFinalMiniGame(node) {
  return normalizedTitle(node) === 'FINAL GAME';
}
function isAnyMiniGame(node) {
  return isNorahMiniGame(node) || isPaulMiniGame(node) || isFinalMiniGame(node);
}
function isFullscreenMiniGame(node) {
  return isPaulMiniGame(node);
}
function isNoraIntroNode(node) {
  return normalizedTitle(node) === 'NORA INTRO VIDEO';
}
function isPaulIntroNode(node) {
  return normalizedTitle(node) === 'PAUL INTRO VIDEO';
}
function isEshuStartNode(node) {
  return /(^|\b)eshu(\b|$)/i.test(`${node?.titleText || ''} ${strip(node?.title || '')} ${node?.media?.src || ''}`);
}
const NODE_CHAPTER_THEME = (() => {
  const themeById = {};
  const visit = (seedIds, theme, shouldStop) => {
    const stack = [...seedIds].filter(Boolean);
    const seen = new Set();
    while (stack.length) {
      const id = stack.pop();
      if (!id || seen.has(id)) continue;
      seen.add(id);
      const node = GAME.nodes[id];
      if (!node || shouldStop(node)) continue;
      themeById[id] = theme;
      (node.outputs || []).forEach(out => {
        if (out.targetType === 'elements') stack.push(out.target);
      });
    }
  };
  const nodes = Object.values(GAME.nodes);
  const paulMini = nodes.find(isPaulMiniGame);
  visit(nodes.filter(isNoraIntroNode).map(node => node.id), 'nora', isPaulIntroNode);
  visit([
    ...nodes.filter(isPaulIntroNode).map(node => node.id),
    ...(paulMini?.outputs || []).map(out => out.target)
  ], 'paul', node => isEshuStartNode(node) || isFinalMiniGame(node));
  return themeById;
})();
function nodeSearchText(node) {
  return [
    node?.titleText,
    node?.title,
    node?.content,
    node?.media?.src,
    node?.media?.alt
  ].filter(Boolean).map(strip).join(' ').toLowerCase();
}
function chapterThemeForNode(node) {
  if (node?.coverTheme) return node.coverTheme;
  if (NODE_CHAPTER_THEME[node?.id]) return NODE_CHAPTER_THEME[node.id];
  const title = `${node?.titleText || ''} ${strip(node?.title || '')}`.toLowerCase();
  const text = nodeSearchText(node);
  if (/\b(paul|harry|john|saul|eshu|elegua|blackbird|woodpecker|parrot|hummingbird)\b/.test(title)) return 'paul';
  if (/\b(nora|norah|jenny|terra|eloween|xylia|bumblebee|lacewing|ant|coworker|pollen|honey)\b/.test(title)) return 'nora';
  if (/\b(paul|harry|john|saul|eshu|elegua|blackbird|woodpecker|parrot|hummingbird)\b/.test(text)) return 'paul';
  if (/\b(nora|norah|jenny|terra|eloween|xylia|bumblebee|lacewing|ant|coworker|pollen|honey)\b/.test(text)) return 'nora';
  return 'nora';
}
function isChoicePage(node) {
  return !isAnyMiniGame(node) && node?.outputs?.length > 1;
}
function hasDecoratedMedia(node) {
  if (node?.coverPage) return false;
  if (!node?.media?.src || isAnyMiniGame(node)) return false;
  if (!NODE_CHAPTER_THEME[node.id]) return false;
  return node.media.type === 'image' || node.media.type === 'video' || !!googleDrivePreviewSrc(node.media.src);
}
function appendMediaDecor(node) {
  if (!hasDecoratedMedia(node)) return;
  const theme = chapterThemeForNode(node);
  const img = document.createElement('img');
  img.className = `media-decor ${theme === 'paul' ? 'feather' : 'honeycomb'}`;
  img.src = theme === 'paul' ? 'assets/feather-decor.png' : 'assets/honeycomb-decor.png';
  img.alt = '';
  img.setAttribute('aria-hidden', 'true');
  media.appendChild(img);
}
function shouldShowVideoToggle(node) {
  const text = `${node?.titleText || ''} ${node?.media?.src || ''}`.toLowerCase();
  if (/\.gif($|[?#])/.test(text) || /\bgif\b/.test(text)) return false;
  return !/(harry asking for help alone|nora helping harry|nora approaching harry)/.test(text);
}

function resetCaptionBounds() {
  const app = document.querySelector('.app');
  app.style.setProperty('--caption-left', '0px');
  app.style.setProperty('--caption-width', '100%');
}
function updateCaptionBoundsFromAspect(aspect = 16 / 9) {
  const app = document.querySelector('.app');
  const cw = media.clientWidth, ch = media.clientHeight;
  if (!cw || !ch) { resetCaptionBounds(); return; }
  const renderedW = Math.round(Math.min(cw, ch * aspect));
  const left = Math.max(0, Math.round((cw - renderedW) / 2));
  app.style.setProperty('--caption-left', left + 'px');
  app.style.setProperty('--caption-width', renderedW + 'px');
  requestAnimationFrame(fitStoryText);
}
function updateCaptionBoundsFromMedia(el) {
  const app = document.querySelector('.app');
  if (!el) { resetCaptionBounds(); return; }
  let iw = 0, ih = 0;
  if (el.tagName === 'IMG') {
    iw = el.naturalWidth; ih = el.naturalHeight;
  } else if (el.tagName === 'VIDEO') {
    iw = el.videoWidth; ih = el.videoHeight;
  }
  const cw = media.clientWidth, ch = media.clientHeight;
  if (!iw || !ih || !cw || !ch) { resetCaptionBounds(); return; }
  const scale = Math.min(cw / iw, ch / ih);
  const renderedW = Math.round(iw * scale);
  const left = Math.max(0, Math.round((cw - renderedW) / 2));
  app.style.setProperty('--caption-left', left + 'px');
  app.style.setProperty('--caption-width', renderedW + 'px');
  requestAnimationFrame(fitStoryText);
}
window.addEventListener('resize', () => {
  updateCaptionBoundsFromAspect();
});

function titleScreenText(node) {
  const contentText = strip(node.content || '');
  const titleText = cleanTitle(strip(node.title) || node.titleText || '');
  const merged = (contentText || titleText || '').trim();
  const chapter = merged.match(/chapter\s*\d+/i) || titleText.match(/chapter\s*\d+/i);
  if (chapter) return chapter[0].toUpperCase();
  if (!node.media && !contentText && titleText && !/^untitled/i.test(titleText)) return titleText;
  return '';
}
function escapeHTML(s) {
  return String(s || '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}
const SPEAKER_CLASSES = {
  Nora: 'nora',
  Jenny: 'jenny',
  Terra: 'terra',
  Linda: 'linda',
  Eloween: 'eloween',
  Xylia: 'xylia',
  Paul: 'paul',
  Harry: 'harry',
  John: 'john',
  Saul: 'saul',
  Eshu: 'eshu',
  Elegua: 'elegua'
};
function formatDialogueHTML(html) {
  const template = document.createElement('template');
  template.innerHTML = html || '<p></p>';
  const names = Object.keys(SPEAKER_CLASSES).join('|');
  const speakerPattern = new RegExp(`\\b(${names}):`, 'g');
  const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(textNode => {
    const text = textNode.nodeValue;
    if (!speakerPattern.test(text)) return;
    speakerPattern.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0;
    text.replace(speakerPattern, (match, name, offset) => {
      if (offset > last) frag.appendChild(document.createTextNode(text.slice(last, offset)));
      const span = document.createElement('span');
      span.className = `speaker ${SPEAKER_CLASSES[name]}`;
      span.textContent = match;
      frag.appendChild(span);
      last = offset + match.length;
      return match;
    });
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    textNode.parentNode.replaceChild(frag, textNode);
  });
  return template.innerHTML;
}
function go(id, push=true) {
  if (!id) return;
  if (push && currentId && GAME.nodes[currentId]) stack.push(currentId);
  currentId = id;
  render();
}
function resolveOutput(out) {
  if (out.targetType === 'branches') return showBranch(out.target);
  go(out.target);
}
function showBranch(branchId) {
  const b = GAME.branches[branchId];
  choicesEl.innerHTML = '';
  endBox.style.display = 'none';
  branchBox.classList.add('active');
  document.getElementById('winBtn').onclick = () => { branchBox.classList.remove('active'); go(b?.if?.target); };
  document.getElementById('loseBtn').onclick = () => { branchBox.classList.remove('active'); go(b?.else?.target); };
}
function renderMedia(node) {
  media.innerHTML = '';
  updateCaptionBoundsFromAspect();
  if (isNorahMiniGame(node)) {
    const frame = document.createElement('iframe');
    frame.className = 'mini-iframe';
    frame.src = 'assets/NORAMINIGAME.html?v=nora-replace-1';
    frame.title = 'Norah mini game';
    frame.setAttribute('allow', 'autoplay; fullscreen');
    media.appendChild(frame);
    return;
  }
  if (isPaulMiniGame(node)) {
    const frame = document.createElement('iframe');
    frame.className = 'mini-iframe';
    frame.src = 'assets/PAUL_MINIGAME.html?v=paul-replace-1';
    frame.title = 'Paul mini game';
    frame.setAttribute('allow', 'autoplay; fullscreen');
    media.appendChild(frame);
    return;
  }
  if (isFinalMiniGame(node)) {
    const frame = document.createElement('iframe');
    frame.className = 'mini-iframe';
    frame.src = 'assets/FINAL_GAME.html?v=fit-1';
    frame.title = 'Final game';
    frame.setAttribute('allow', 'autoplay; fullscreen');
    media.appendChild(frame);
    return;
  }
  if (!node.media || !node.media.src) {
    const titleText = titleScreenText(node);
    if (titleText) {
      media.innerHTML = `<div class="title-screen${titleText.length > 18 ? ' small' : ''}">${escapeHTML(titleText)}</div>`;
    } else {
      media.innerHTML = '<div class="media-placeholder"></div>';
    }
    updateCaptionBoundsFromAspect();
    return;
  }
  const driveSrc = googleDrivePreviewSrc(node.media.src);
  if (driveSrc) {
    const frame = document.createElement('iframe');
    frame.className = 'mini-iframe';
    frame.src = driveSrc;
    frame.title = strip(node.title) || 'Google Drive video';
    frame.setAttribute('allow', 'autoplay; fullscreen');
    frame.setAttribute('allowfullscreen', '');
    media.appendChild(frame);
    appendMediaDecor(node);
    updateCaptionBoundsFromAspect();
    return;
  }
  const src = encodeSrc(node.media.src);
  if (node.media.type === 'video') {
    const v = document.createElement('video');
    v.src = src; v.playsInline = true; v.muted = true;
    v.onerror = () => {
      media.innerHTML = '<div class="media-placeholder">Put the required video file into the external_videos folder, then reopen index.html.</div>';
    };
    if (node.media.loop) v.loop = true;
    if (node.media.controls) v.controls = true;
    media.appendChild(v);
    if (shouldShowVideoToggle(node)) {
      const toggle = document.createElement('button');
      toggle.className = 'video-toggle';
      toggle.type = 'button';
      const updateToggle = () => { toggle.textContent = v.paused ? 'Play' : 'Pause'; };
      toggle.addEventListener('click', event => {
        event.stopPropagation();
        if (v.paused) v.play().catch(()=>{});
        else v.pause();
        updateToggle();
      });
      v.addEventListener('play', updateToggle);
      v.addEventListener('pause', updateToggle);
      v.addEventListener('ended', updateToggle);
      media.appendChild(toggle);
      updateToggle();
    }
    if (node.media.autoplay) { v.autoplay = true; v.play().catch(()=>{}); }
    appendMediaDecor(node);
    updateCaptionBoundsFromAspect();
  } else {
    const img = document.createElement('img');
    if (node.coverPage) {
      img.loading = 'eager';
      img.decoding = 'sync';
      img.fetchPriority = 'high';
    }
    img.src = src;
    img.alt = strip(node.title) || 'Scene image';
    img.addEventListener('load', () => updateCaptionBoundsFromAspect());
    media.appendChild(img);
    if (node.coverPage) {
      const btn = document.createElement('button');
      btn.className = 'cover-action';
      btn.type = 'button';
      btn.textContent = node.coverActionLabel || 'Start';
      btn.addEventListener('click', event => {
        event.stopPropagation();
        autoContinue();
      });
      media.appendChild(btn);
    }
    appendMediaDecor(node);
    updateCaptionBoundsFromAspect();
  }
}
function renderChoices(node) {
  choicesEl.innerHTML = '';
  activeAutoOutput = null;
  document.querySelector('.story-card').classList.remove('can-continue');
  branchBox.classList.remove('active');
  endBox.style.display = node.outputs.length ? 'none' : 'block';

  if (isNorahMiniGame(node)) {
    if (completedMinigames.has(node.id)) {
      contentEl.innerHTML = '<p class="complete-note">Mission complete. Click here to continue.</p>';
      activeAutoOutput = node.outputs[0] || null;
      document.querySelector('.story-card').classList.toggle('can-continue', !!activeAutoOutput);
      const dot = document.createElement('span');
      dot.className = 'continue-dot';
      dot.title = 'Click to continue';
      contentEl.appendChild(dot);
    } else {
      contentEl.innerHTML = '<p class="locked-note">Complete Norah’s mini game first. The next scene will unlock after collecting 10 pollen.</p>';
    }
    return;
  }
  if (isPaulMiniGame(node)) {
    if (completedMinigames.has(node.id)) {
      contentEl.innerHTML = '<p class="complete-note">Mission complete. Click here to continue.</p>';
      activeAutoOutput = node.outputs[0] || null;
      document.querySelector('.story-card').classList.toggle('can-continue', !!activeAutoOutput);
      const dot = document.createElement('span');
      dot.className = 'continue-dot';
      dot.title = 'Click to continue';
      contentEl.appendChild(dot);
    } else {
      contentEl.innerHTML = '<p class="locked-note">Complete Paul’s mini game first. The next scene will unlock after finishing the task matching.</p>';
    }
    return;
  }
  if (isFinalMiniGame(node)) {
    contentEl.innerHTML = '<p class="locked-note">Complete the final game to reveal the ending.</p>';
    return;
  }

  if (node.outputs.length === 1 && !strip(node.outputs[0].label)) {
    activeAutoOutput = node.outputs[0];
    document.querySelector('.story-card').classList.add('can-continue');
    const dot = document.createElement('span');
    dot.className = 'continue-dot';
    dot.title = 'Click to continue';
    contentEl.appendChild(dot);
    return;
  }

  node.outputs.forEach((out, i) => {
    const btn = document.createElement('button'); btn.className='choice';
    btn.innerHTML = formatDialogueHTML(out.label || `<p>Choice ${i+1}</p>`);
    btn.addEventListener('click', (event) => {
      event.stopPropagation();
      transitionTo(() => resolveOutput(out));
    });
    choicesEl.appendChild(btn);
  });
}
function transitionTo(action) {
  if (isTransitioning) return;
  isTransitioning = true;
  const card = document.querySelector('.story-card');
  card.classList.remove('fade-in');
  card.classList.add('fade-out');
  setTimeout(() => {
    action();
    card.classList.remove('fade-out');
    card.classList.add('fade-in');
    setTimeout(() => { isTransitioning = false; card.classList.remove('fade-in'); }, 820);
  }, 420);
}
function autoContinue() {
  if (!activeAutoOutput) return;
  transitionTo(() => resolveOutput(activeAutoOutput));
}
function renderHistory() {
  historyList.innerHTML = '';
  visitedTitles.slice(-40).forEach(t => {
    const li=document.createElement('li'); li.textContent=t || 'Untitled scene'; historyList.appendChild(li);
  });
}

const savedFontSize = localStorage.getItem('gleanianFontSize');
const adminState = {
  fontSize: savedFontSize && Number(savedFontSize) !== 28 ? Number(savedFontSize) : 20,
  lineHeight: Number(localStorage.getItem('gleanianLineHeight')) || 1.42
};
if (savedFontSize && Number(savedFontSize) === 28) localStorage.removeItem('gleanianFontSize');
const adminNodeList = Object.values(GAME.nodes).map((node, index) => {
  const title = cleanTitle(strip(node.title)) || node.titleText || 'Untitled Scene';
  const preview = strip(node.content).slice(0, 90);
  return {
    index: index + 1,
    id: node.id,
    title,
    preview,
    search: `${title} ${node.titleText || ''} ${preview} ${node.id}`.toLowerCase()
  };
});
function applyAdminStyle() {
  adminState.fontSize = 20;
  document.documentElement.style.setProperty('--story-font-size', '20pt');
  document.documentElement.style.setProperty('--story-line-height', adminState.lineHeight);
  fontSizeRange.value = adminState.fontSize;
  lineHeightRange.value = adminState.lineHeight;
  fontSizeValue.textContent = adminState.fontSize + 'pt';
  lineHeightValue.textContent = adminState.lineHeight.toFixed(2);
  fitStoryText();
}
function renderNodeOptions() {
  const query = nodeSearch.value.trim().toLowerCase();
  const matches = adminNodeList.filter(item => !query || item.search.includes(query)).slice(0, 140);
  nodeJumpSelect.innerHTML = matches.map(item => {
    const marker = item.id === currentId ? '● ' : '';
    const preview = item.preview ? ` - ${item.preview}` : '';
    return `<option value="${item.id}">${marker}${item.index}. ${escapeHTML(item.title)}${escapeHTML(preview)}</option>`;
  }).join('');
  if ([...nodeJumpSelect.options].some(option => option.value === currentId)) {
    nodeJumpSelect.value = currentId;
  } else if (nodeJumpSelect.options.length) {
    nodeJumpSelect.selectedIndex = 0;
  }
}
function toggleAdminPanel(force) {
  const open = typeof force === 'boolean' ? force : !adminPanel.classList.contains('active');
  adminPanel.classList.toggle('active', open);
  adminPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
  adminToggle.textContent = open ? 'Close Admin' : 'Admin';
  if (open) renderNodeOptions();
}
function jumpToAdminNode() {
  const target = nodeJumpSelect.value;
  if (!target || !GAME.nodes[target]) return;
  toggleAdminPanel(false);
  go(target);
}
function setSkipButtonVisible(show) {
  const node = GAME.nodes[currentId];
  const canShow = show && node && isAnyMiniGame(node) && !completedMinigames.has(node.id);
  skipGameBtn.classList.toggle('active', !!canShow);
}

function fitStoryText() {
  contentEl.style.fontSize = '';
  contentEl.style.lineHeight = '';
  choicesEl.style.gap = '';
}

function render() {
  const node = GAME.nodes[currentId];
  if (!node) {
    contentEl.innerHTML = '<p>Scene not found.</p>'; return;
  }
  const plainTitle = cleanTitle(strip(node.title)) || 'Untitled Scene';
  if (visitedTitles[visitedTitles.length-1] !== plainTitle) visitedTitles.push(plainTitle);
  titleEl.textContent = plainTitle;
  const appEl = document.querySelector('.app');
  const theme = chapterThemeForNode(node);
  appEl.classList.toggle('minigame', isFullscreenMiniGame(node));
  appEl.classList.toggle('final-minigame', isFinalMiniGame(node));
  appEl.classList.toggle('nora-theme', theme === 'nora');
  appEl.classList.toggle('paul-theme', theme === 'paul');
  appEl.classList.toggle('choice-page', isChoicePage(node));
  appEl.classList.toggle('has-media-decor', hasDecoratedMedia(node));
  appEl.classList.toggle('cover-page', !!node.coverPage);
  setSkipButtonVisible(false);
  contentEl.innerHTML = formatDialogueHTML(node.content || '<p></p>');
  renderMedia(node); renderChoices(node); renderHistory(); fitStoryText();
  if (adminPanel.classList.contains('active')) renderNodeOptions();
}

let vSkipCount = 0;
let vSkipTimer = null;
function completeFinalGame(success) {
  const node = GAME.nodes[currentId];
  if (!node || !isFinalMiniGame(node)) return;
  completedMinigames.add(node.id);
  const out = node.outputs[0];
  if (out && out.targetType === 'branches') {
    const b = GAME.branches[out.target];
    const target = success ? b?.if?.target : b?.else?.target;
    if (target) { go(target); return; }
  }
  if (out) resolveOutput(out);
}
function skipCurrentMiniGame() {
  const node = GAME.nodes[currentId];
  if (!node || !isAnyMiniGame(node) || completedMinigames.has(node.id)) return;
  setSkipButtonVisible(false);
  if (isFinalMiniGame(node)) { completeFinalGame(true); return; }
  completedMinigames.add(node.id);
  renderChoices(node);
  fitStoryText();
}
function registerVSkipPress() {
  const node = GAME.nodes[currentId];
  if (!node || !isAnyMiniGame(node) || completedMinigames.has(node.id)) return;
  vSkipCount += 1;
  clearTimeout(vSkipTimer);
  vSkipTimer = setTimeout(() => { vSkipCount = 0; }, 1400);
  if (vSkipCount >= 4) {
    vSkipCount = 0;
    clearTimeout(vSkipTimer);
    setSkipButtonVisible(true);
  }
}
window.addEventListener('keydown', e => {
  if ((e.key || '').toLowerCase() === 'v') registerVSkipPress();
  if (e.key==='ArrowRight') { if (activeAutoOutput) autoContinue(); else if (choicesEl.children.length===1) choicesEl.children[0].click(); }
  if (e.key==='ArrowLeft') document.getElementById('backBtn').click();
});
window.addEventListener('message', e => {
  if (!e.data || !e.data.type) return;
  const node = GAME.nodes[currentId];
  if (e.data.type === 'MINIGAME_SKIP_VVVV') {
    skipCurrentMiniGame();
    return;
  }
  if ((e.data.type === 'NORAMINIGAME_COMPLETE' || e.data.type === 'NORAMINIGAME_CONTINUE') && isNorahMiniGame(node)) {
    completedMinigames.add(node.id);
    setSkipButtonVisible(false);
    renderChoices(node);
    fitStoryText();
  }
  if (e.data.type === 'PAUL_MINIGAME_COMPLETE' && isPaulMiniGame(node)) {
    completedMinigames.add(node.id);
    setSkipButtonVisible(false);
    if (node.outputs[0]) {
      transitionTo(() => resolveOutput(node.outputs[0]));
    } else {
      renderChoices(node);
      fitStoryText();
    }
  }
  if (e.data.type === 'FINAL_GAME_COMPLETE' && isFinalMiniGame(node)) {
    setSkipButtonVisible(false);
    completeFinalGame(!!e.data.success);
  }
});
render();
applyAdminStyle();
</script>
</body>
</html>
